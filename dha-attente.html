<!DOCTYPE html>
<html lang="fr">
<head>
<script src="dha-api.js"></script>
<script src="dha-theme.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DHA — Accès en cours de validation</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#050914;--card:#080e1f;--blue:#1E64FF;--cyan:#00D4FF;--gold:#FFD700;--green:#00FF88;--red:#FF4466;--white:#E8F4FF;--dim:rgba(232,244,255,0.55);--border:rgba(30,100,255,0.18);}
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;background:radial-gradient(900px 500px at 50% -10%,rgba(30,100,255,0.22),transparent 60%),var(--bg);color:var(--white);font-family:'Exo 2',sans-serif;display:flex;align-items:center;justify-content:center;padding:32px max(16px,env(safe-area-inset-left,0px));}
.box{position:relative;z-index:5;width:min(480px,100%);text-align:center;}
.logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:26px;letter-spacing:3px;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:28px;}
.card{background:var(--card);border:1px solid rgba(255,215,0,0.35);border-radius:22px;padding:32px 24px;}
.ic{width:84px;height:84px;margin:0 auto 18px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:40px;background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.4);animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0.25)}50%{box-shadow:0 0 0 14px rgba(255,215,0,0)}}
h1{font-family:'Orbitron',sans-serif;font-size:17px;letter-spacing:1.5px;margin-bottom:12px;}
p{font-size:15px;line-height:1.6;color:var(--dim);margin-bottom:14px;}
p b{color:var(--white);}
.pack{display:inline-block;margin:4px 0 18px;padding:8px 14px;border-radius:99px;background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.3);font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:1px;color:var(--cyan);}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:0;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;cursor:pointer;text-decoration:none;margin-top:10px;}
.btn.go{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#020610;}
.btn.wa{background:rgba(37,211,102,0.12);color:#25D366;border:1px solid rgba(37,211,102,0.35);}
.btn.out{background:none;color:var(--red);font-size:9px;}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.msg{font-size:13px;color:var(--gold);min-height:18px;margin-top:10px;}
@media(prefers-reduced-motion:reduce){.ic{animation:none}}
</style>
</head>
<body>
<div class="box">
  <div class="logo">DHA</div>
  <div class="card">
    <div class="ic">⏳</div>
    <h1>ACCÈS EN COURS DE VALIDATION</h1>
    <p>Ton inscription est bien reçue <b id="at-nom"></b>. Je vérifie ton paiement pour l'offre :</p>
    <div class="pack" id="at-pack">—</div>
    <p>Dès que c'est validé, ton accès s'ouvre automatiquement, en général en quelques heures. Tu peux laisser cette page ouverte.</p>
    <button type="button" class="btn go" id="at-check">↻ VÉRIFIER MAINTENANT</button>
    <a class="btn wa" href="https://wa.me/qr/OCPS7DRIVP76L1" target="_blank" rel="noopener">💬 UNE QUESTION ? ÉCRIS-MOI</a>
    <button type="button" class="btn out" id="at-out">SE DÉCONNECTER</button>
    <div class="msg" id="at-msg" role="status"></div>
  </div>
</div>
<script>
var PACKS={copy:'Copy trading seul · 30 €/mois','180':'Essentiel · 180 €','500':'Accompagnement en groupe · 500 €','750':'Accompagnement 1:1 · 750 €'};
var m=null; try{ m=JSON.parse(localStorage.getItem('dha_member')||'null'); }catch(e){}
if(!m){ location.replace('dha-connexion.html'); }
function afficher(x){ document.getElementById('at-nom').textContent=x.prenom||x.pseudo||''; document.getElementById('at-pack').textContent=PACKS[x.pack]||'Offre à confirmer'; }
if(m) afficher(m);
async function verifier(manuel){
  var msg=document.getElementById('at-msg');
  try{
    var me=await DHA.me();
    if(me){ m=Object.assign({},m,me); try{ localStorage.setItem('dha_member',JSON.stringify(m)); }catch(e){} afficher(m);
      if(me.pack_valide!==false){ msg.textContent='✅ Accès validé, c\'est parti !'; setTimeout(function(){ location.replace(me.pack==='copy'?'dha-espace-copy.html':'dha-dashboard.html'); },700); return; } }
    if(manuel) msg.textContent='Pas encore validé. Je te préviens dès que c\'est fait.';
  }catch(e){ if(manuel) msg.textContent='Connexion impossible, réessaie dans un instant.'; }
}
document.getElementById('at-check').onclick=function(){ verifier(true); };
document.getElementById('at-out').onclick=function(){ try{ localStorage.removeItem('dha_member'); localStorage.removeItem('dha_token'); }catch(e){} location.href='dha-connexion.html'; };
verifier(false); setInterval(function(){ if(document.visibilityState==='visible') verifier(false); },30000);
</script>
</body>
</html>
