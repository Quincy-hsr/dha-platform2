<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cerveau DHA</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#0F1B2D; --on-ink:#FFFFFF; --muted:#566274;
  --line:#D9DFE7; --soft:#E5EAF0; --gain:#0B8A7A; --gain-bg:#DCF2EE;
  --leak:#D6343B; --leak-bg:#FCE7E8; --on-leak:#FFFFFF; --focus:#2B6BFF;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A111E; --surface:#111B2D; --ink:#E9EEF6; --on-ink:#0A111E; --muted:#98A5B8;
    --line:#22314A; --soft:#1B2A42; --gain:#2DD4BF; --gain-bg:rgba(45,212,191,.14);
    --leak:#FF6B6B; --leak-bg:rgba(255,107,107,.13); --on-leak:#1A0B0C; --focus:#7FA6FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A111E; --surface:#111B2D; --ink:#E9EEF6; --on-ink:#0A111E; --muted:#98A5B8;
  --line:#22314A; --soft:#1B2A42; --gain:#2DD4BF; --gain-bg:rgba(45,212,191,.14);
  --leak:#FF6B6B; --leak-bg:rgba(255,107,107,.13); --on-leak:#1A0B0C; --focus:#7FA6FF;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
p{margin:0}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);gap:0;max-width:1280px;margin:0 auto}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;padding:24px 14px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px}
.brand-mark{font-size:22px;line-height:1}
.brand-name{font:700 22px var(--f-display);letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:500;cursor:pointer;text-align:left}
.nav .ni{font-size:16px;line-height:1;width:20px;text-align:center}
.nav .nl{flex:1}
.nav .ns{display:none}
.nav .count{margin-left:auto}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
.count{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--ink)}
.nav button[aria-current="page"] .count{background:rgba(127,127,127,.35);color:inherit}
main{padding:24px 24px 60px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;margin-bottom:20px}
.top h1{font-size:clamp(26px,4vw,34px);font-weight:700}
.top-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--gain)}
.sync.warn i{background:var(--leak)}
.btn{font-weight:600;font-size:14px;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.danger{color:var(--leak);border-color:var(--leak);background:transparent}
.btn.small{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
:where(button,input,select,textarea,a,summary):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.seg button[disabled]{opacity:.4;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.card h2{font-size:18px;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px}
.stack{display:grid;gap:16px}
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:16px;align-items:start}
.stage{display:grid;gap:8px}
.stage-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.stage-label{font-weight:600}
.stage-n{font:700 clamp(32px,5vw,48px)/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:5px}
.stage.win .bar i{background:var(--gain)}
.link{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:12px 0 12px 12px;padding:8px 12px;border-left:3px solid var(--line);font-size:14px;color:var(--muted)}
.link .rate{font:600 20px var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.link.ok{border-left-color:var(--gain)}
.link.ok .rate{color:var(--gain)}
.link.leak{border-left-color:var(--leak);background:var(--leak-bg);border-radius:0 10px 10px 0}
.link.leak .rate{color:var(--leak)}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--leak);color:var(--on-leak)}
.kpis{display:grid;gap:0}
.kpi{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.kpi:last-child{border-bottom:0}
.kpi b{font:700 26px/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:14px}
.kpi button{all:unset;cursor:pointer;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.kpi button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.callout{border-radius:14px;padding:16px 18px;border:1px solid var(--line);background:var(--surface)}
.callout.leak{border-color:var(--leak);background:var(--leak-bg)}
.callout.ok{border-color:var(--gain);background:var(--gain-bg)}
.callout strong{font-family:var(--f-display);font-size:17px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;padding-right:0;padding-left:10px}
.mini{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--soft);vertical-align:middle;margin-right:8px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--ink)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
/* prospects */
.qa{display:grid;gap:12px;margin-bottom:16px}
label,.lbl{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
textarea{resize:vertical;min-height:84px}
.qa-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip small{font-weight:600;margin-left:5px;opacity:.75}
.filters{display:grid;gap:10px;margin:4px 0 16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fbody{display:grid;gap:10px}
[hidden]{display:none!important}
.ftoggle{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;color:var(--ink)}
.ftoggle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.fon{display:inline-block;margin-left:6px;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--ink);color:var(--on-ink)}
.frow .flbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:74px}
.frow .chip{padding:5px 11px}
.fbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.fbar select{width:auto;font-size:14px;padding:6px 10px}
.fcount{font-size:14px;font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.toolbar input[type=search]{max-width:280px}
.plist{display:grid;gap:0}
.prow{display:grid;grid-template-columns:minmax(150px,1.1fr) auto minmax(110px,.7fr) minmax(0,1.3fr);gap:10px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.p-handle{all:unset;cursor:pointer;font-weight:600;font-size:15px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.p-handle:hover{text-decoration-color:var(--ink)}
.p-handle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.p-meta{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.steps{display:inline-flex;gap:4px;flex-wrap:wrap}
.steps button{font-weight:600;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.steps button:hover{border-color:var(--ink);color:var(--ink)}
.steps button.done{background:var(--soft);border-color:transparent;color:var(--ink)}
.steps button.now{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.steps button.now.lost{background:var(--leak);border-color:var(--leak);color:var(--on-leak)}
.steps button.now.won{background:var(--gain);border-color:var(--gain);color:#fff}
.p-when{font-size:13px;color:var(--muted)}
.p-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.stepwrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:4px}
.stage-done{font-weight:600;font-size:14px;color:var(--muted)}
.rev-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;margin-left:6px;white-space:nowrap}
.rev-badge.sdr{background:var(--gain-bg);color:var(--gain);border-color:transparent}
.rev-badge.sr{background:var(--leak-bg);color:var(--leak);border-color:transparent}
.pcadence{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
.pcadence .gauge{width:70px}
.gauge.late i{background:var(--leak)}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.goal{display:grid;gap:14px;align-content:start}
.goal h2{margin:0}
.goal-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.goal-main b{font:700 clamp(40px,6vw,58px)/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.goal-main .of{font:600 20px var(--f-display);color:var(--muted)}
.goal-main .pc{margin-left:auto;font:600 22px var(--f-display);font-variant-numeric:tabular-nums}
.gauge{position:relative;height:16px;border-radius:8px;background:var(--soft);overflow:hidden}
.gauge i{display:block;height:100%;border-radius:8px;background:var(--ink)}
.gauge.done i{background:var(--gain)}
.gauge .mark{position:absolute;top:0;bottom:0;width:4px;background:var(--focus)}
.gauge.small{height:10px;border-radius:5px}
.today-h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.today-h b{font-variant-numeric:tabular-nums}
.pace{font-size:14px}
.pace .ok{color:var(--gain);font-weight:600}
.pace .late{color:var(--leak);font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{display:grid;gap:4px;justify-items:center;font-size:12px;color:var(--muted)}
.day b{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.day.today span{color:var(--ink);font-weight:700}
.dbar{position:relative;width:100%;max-width:36px;height:60px;background:var(--soft);border-radius:6px;overflow:hidden;display:flex;align-items:flex-end}
.dbar i{display:block;width:100%;background:var(--ink);border-radius:5px 5px 0 0}
.dbar i.hit{background:var(--gain)}
.dbar .line{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--muted);opacity:.8;z-index:1}
.paybox{display:grid;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px}
.paysum{font-size:15px;margin:0}
.tl b{margin-right:8px}
.checks{display:grid;gap:8px}
.section{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.section summary{cursor:pointer;font-weight:600;font-size:15px}
.section[open] summary{margin-bottom:10px}
.months{display:grid;gap:10px}
.month{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mods summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);margin-top:8px}
.modlist{display:grid;gap:6px;margin-top:10px}
.modrow{display:grid;grid-template-columns:84px 1fr 1fr;align-items:center;gap:8px;font-size:14px}
.modrow .check{font-size:14px}
.plat{font-weight:600;font-size:14px;margin:2px 0}
.ccard-wrap{display:grid;gap:10px}
.ccard-inner{all:unset;cursor:pointer;display:grid;gap:10px;width:100%}
.launch-cal{justify-self:start}
.totals{font-size:14px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--ink);margin:0;cursor:pointer}
.check input{width:20px;height:20px;padding:0;accent-color:var(--gain);flex:none}
.logrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.logrow:last-child{border-bottom:0}
.tl-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.tl-row:last-child{border-bottom:0}
.stage-n-btn{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--leak-bg);color:var(--leak);margin-left:6px}
.badge.ok{background:var(--gain-bg);color:var(--gain)}
.p-note{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* content */
.cf{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.cf .wide{grid-column:span 2}
.crow{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.crow:last-child{border-bottom:0}
.crow-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.crow-title{font-weight:600}
.crow-meta{font-size:13px;color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.nums input{padding:7px 9px}
.iconbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;padding:4px 6px;border-radius:6px}
.iconbtn:hover{color:var(--leak)}
/* clients */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ccard{text-align:left;cursor:pointer;display:grid;gap:10px;width:100%}
.ccard:hover{border-color:var(--muted)}
.ccard h3{font-size:18px}
.ccard .goal{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.prog .bar{flex:1}
.prog .bar i{background:var(--gain)}
.prog{gap:10px}
.prog .gauge{flex:1}
.prog .gauge i{background:var(--ink)}
.prog .gauge.late i{background:var(--leak)}
/* dialog */
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(8,14,26,.55)}
.dlg-body{padding:22px;display:grid;gap:14px;overflow:auto}
.dlg-body h2{font-size:22px}
.dlg-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;padding:14px 22px;border-top:1px solid var(--line)}
.dlg-foot .r{display:flex;gap:10px;margin-left:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=range]{padding:0;border:0;accent-color:var(--gain)}
.tl{display:grid;gap:10px;max-height:220px;overflow:auto}
.tl div{border-left:3px solid var(--line);padding:2px 0 2px 12px;font-size:14px}
.tl small{display:block;color:var(--muted);font-size:12px}
/* ai */
.ai-out{margin-top:16px;line-height:1.6;max-width:72ch}
.ai-out h3{font-size:18px;margin:20px 0 6px}
.ai-out ul,.ai-out ol{margin:6px 0 10px;padding-left:22px}
.ai-out li{margin:4px 0}
.ai-out p{margin:8px 0}
.thinking{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:11px 16px;border-radius:10px;font-size:14px;font-weight:500;display:none;gap:14px;align-items:center;z-index:50;max-width:calc(100vw - 24px)}
.toast.show{display:flex}
.toast button{background:transparent;border:0;color:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
@media (max-width:860px){
  .app{display:block}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
  .brand{display:none}
  .nav{flex-direction:row;gap:2px}
  .nav button{flex:1;flex-direction:column;justify-content:center;gap:3px;padding:6px 0;font-size:9.5px;text-align:center;min-width:0;position:relative}
  .nav .ni{font-size:18px;width:auto}
  .nav .nl{display:none}
  .nav .ns{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .nav .count{position:absolute;top:2px;right:calc(50% - 20px);font-size:9px;padding:0 5px;background:var(--leak);color:var(--on-leak)}
  main{padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .hero{grid-template-columns:1fr}
  .prow{grid-template-columns:1fr;gap:8px}
  .cf .wide{grid-column:span 1}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.gate form{width:100%;max-width:360px;display:grid;gap:12px}
.gate h1{font-size:28px}
.gate .err{color:var(--leak);font-size:14px;min-height:20px}

<script>
(function(){
'use strict';

/* ---------- utilitaires ---------- */
var $ = function(s, r){ return (r||document).querySelector(s); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var DAY = 864e5;
var uid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); };
var fmtN = function(n){ return Number(n||0).toLocaleString('fr-FR'); };
var rate = function(a,b){ return b>0 ? a/b*100 : null; };
var pct = function(x){ return x==null ? '—' : x.toLocaleString('fr-FR',{maximumFractionDigits:1}) + '\u00a0%'; };
var euro = function(n){ return Number(n||0).toLocaleString('fr-FR',{maximumFractionDigits:0}) + '\u00a0€'; };
var pad = function(n){ return (n<10?'0':'') + n; };
var dtLocal = function(ts){ if(!ts) return ''; var d = new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); };
var fromDtLocal = function(v){ if(!v) return null; var t = new Date(v).getTime(); return isNaN(t) ? null : t; };
function gcalUTC(ts){ return new Date(ts).toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'; }
function gcalDateOnly(ts){ return ymd(ts).replace(/-/g,''); }
function gcalLink(title, startTs, endTs, details, allDay){
  var dates = allDay ? (gcalDateOnly(startTs)+'/'+gcalDateOnly(endTs)) : (gcalUTC(startTs)+'/'+gcalUTC(endTs));
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+dates+(details?'&details='+encodeURIComponent(details):'')+'&ctz=Europe/Paris';
}
var ymd = function(ts){ var d = new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
var fromYmd = function(v){
  if(!v) return Date.now();
  if(v === ymd(Date.now())) return Date.now();
  var t = new Date(v+'T12:00:00').getTime();
  return isNaN(t) ? Date.now() : t;
};
var dShort = function(ts){ return new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'}).format(new Date(ts)); };
var ago = function(ts){
  var d = Math.floor((Date.now()-ts)/DAY);
  if(d<=0) return "aujourd'hui";
  if(d===1) return 'hier';
  return 'il y a '+d+' j';
};
var weekStart = function(ts){
  var d = new Date(ts); d.setHours(0,0,0,0);
  var wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd);
  return d.getTime();
};

var DEFAULT_TARGETS = {reply:25, call:30, show:80, close:30};
var DEFAULT_GOALS = {content:15, dm:210, replies:0, calls:0, clients:0};
var EBOOK = 'Ebook (mot-clé DHA)';
var SOURCES = [EBOOK,'Like ou abonné de mon contenu','Like ou abonné de la niche','Abonné de mes abonnés','Recommandation','Autre'];
var DM_SOURCES = SOURCES.slice(1);
var PLATFORMS = ['Instagram','TikTok','Autre'];
var CTAS = ['Commente « DHA »','DM « DHA »','Aucun'];
var CI_TYPES = ['Message','Appel individuel','Appel de groupe','RDV en personne'];
var ONB = [['access','Accès à la plateforme donné'],['awareness','Fichier « prise de conscience » terminé'],['kickoff','Appel de prise en main fait']];
var MILES = [['m1','Mois 1 : stratégie maîtrisée'],['m2','Mois 2 : objectif en démo atteint'],['m3','Mois 3 : passage en réel'],['m4','Mois 4 : challenge validé']];
var STEP_TOTAL = ONB.length + MILES.length;
var MODULES = 17;
var MONTH_MODS = {m1:[1,7], m2:[8,12], m3:[13,15], m4:[16,17]};
var OFFERS = ['Essentiel 180€','Groupe 500€','1:1 750€'];
var OFFER_INFO = {'Essentiel 180€':{price:180, multi:false, n:0}, 'Groupe 500€':{price:500, multi:true, n:3}, '1:1 750€':{price:750, multi:true, n:3}};
// Module affiché sur la plateforme → action enregistrée quand le membre le termine (même table que dha-formation.html)
var MOD_KEYS = {1:'bloc_m1',2:'bloc_m2_b1',3:'bloc_m4',4:'bloc_m16',5:'bloc_m5',6:'bloc_m7_b1',7:'bloc_m8_b1',8:'bloc_m17',9:'bloc_m11_b1',10:'bloc_m12_b1',11:'bloc_m13_b1',12:'bloc_m14_b1',13:'bloc_m18',14:'bloc_m10_b1',15:null,16:'bloc_m6',17:'bloc_m15_b1'};
var CONTENT_PLATFORMS = ['Instagram','TikTok','Les deux'];
var METRICS = [['views','Vues'],['saves','Enregistrements'],['leads','Ebooks demandés'],['clients','Clients générés']];
var pad2 = function(n){ return n<10 ? '0'+n : ''+n; };
var FORMATS = ['Reel','Carrousel','Story','Post','Live','Autre'];
var LOST = ['Pas de réponse après relances','Pas intéressé','Budget','Pas le bon moment','Concurrent','Autre'];
var STAGES = ['dm','reponse','call','held','close'];
var STAGE_LABEL = {dm:'DM',reponse:'Réponse',call:'Call booké',held:'Call fait',close:'Client',perdu:'Perdu'};
function nextStage(status){ var i = STAGES.indexOf(status); return (i>=0 && i<STAGES.length-1) ? STAGES[i+1] : null; }
var CLIENT_STATUS = [['actif','Actif'],['pause','En pause'],['termine','Terminé'],['perdu','Parti']];

/* ---------- état ---------- */
var S = {
  mode:'loading', tab:'objectifs', period:'month',
  prospects:[], content:[], clients:[], dmlogs:[],
  targets:Object.assign({}, DEFAULT_TARGETS), goals:Object.assign({}, DEFAULT_GOALS), weekOffset:0,
  filter:'all', q:'', limit:60, expandedSteps:{},
  pf:{act:[], stage:[], rev:[], src:[]}, sort:'recent', funnelView:null, pfOpen:(window.innerWidth>860),

  error:''
};
var dbh = null, sampleFn = null, dlNs = null, aiCtl = null, skeletonTab = null, raf = 0;
var local = {prospects:{}, content:{}, clients:{}, dmlogs:{}, settings:{}};
var LS = 'cerveau-v1', LSQ = 'cerveau-qa';

try{ var q0 = JSON.parse(localStorage.getItem(LSQ)||'null'); if(q0) S.qa = Object.assign(S.qa, q0); }catch(e){}
try{ var pf0 = JSON.parse(localStorage.getItem('cerveau-pf')||'null'); if(pf0){ S.pf = Object.assign(S.pf, pf0.pf||{}); S.sort = pf0.sort||'recent'; } }catch(e){}
function savePf(){ try{ localStorage.setItem('cerveau-pf', JSON.stringify({pf:S.pf, sort:S.sort})); }catch(e){} }

/* ---------- stockage ---------- */
function toList(map){ return Object.keys(map).map(function(id){ return Object.assign({}, map[id], {id:id}); }); }
function persistLocal(){ try{ localStorage.setItem(LS, JSON.stringify(local)); }catch(e){} }
function rebuildLocal(){

  S.prospects = toList(local.prospects); S.content = toList(local.content); S.clients = toList(local.clients);
  S.targets = Object.assign({}, DEFAULT_TARGETS, local.settings.targets||{});

}
function connectLocal(){
  S.mode = 'local';
  try{ var raw = localStorage.getItem(LS); if(raw){ var o = JSON.parse(raw); local = Object.assign(local, o); } }catch(e){}
  rebuildLocal(); schedule();
}
/* ---------- Supabase ---------- */
var SUPA_URL = 'https://kdetwppxsfoagyndrlzr.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkZXR3cHB4c2ZvYWd5bmRybHpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzM3NjQsImV4cCI6MjA5MjgwOTc2NH0.OodaFQKEHcncDYdO6uM121NAUbyxD4UxpptSjzzZOi0';
var SUPA_H = {'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY, 'Content-Type':'application/json'};
var TABLE = 'cerveau_docs';
function makeSupaDb(){
  var subs = {}; // collection -> [{ok, err, docId}]
  function fetchColl(coll){
    return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?coll=eq.'+encodeURIComponent(coll)+'&select=id,data', {headers:SUPA_H})
      .then(function(r){ if(!r.ok) throw {code:'http_'+r.status}; return r.json(); });
  }
  function refresh(coll){
    var ls = subs[coll]; if(!ls || !ls.length) return Promise.resolve();
    return fetchColl(coll).then(function(rows){
      ls.forEach(function(l){
        if(l.docId){ var row = rows.filter(function(r){ return r.id===l.docId; })[0]; l.ok({exists:!!row, data:function(){ return row ? (row.data||{}) : {}; }}); }
        else l.ok({docs:rows.map(function(r){ return {id:r.id, data:function(){ return r.data||{}; }}; })});
      });
    }).catch(function(e){ ls.forEach(function(l){ if(l.err) l.err(e); }); });
  }
  function sub(coll, docId, ok, err){ (subs[coll] = subs[coll] || []).push({ok:ok, err:err, docId:docId}); refresh(coll); }
  function upsert(coll, id, data){
    return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?on_conflict=coll,id', {method:'POST', headers:Object.assign({'Prefer':'resolution=merge-duplicates,return=minimal'}, SUPA_H), body:JSON.stringify({coll:coll, id:id, data:data, updated_at:new Date().toISOString()})})
      .then(function(r){ if(!r.ok) throw {code:'http_'+r.status}; return refresh(coll); });
  }
  function remove(coll, id){
    return fetch(SUPA_URL+'/rest/v1/'+TABLE+'?coll=eq.'+encodeURIComponent(coll)+'&id=eq.'+encodeURIComponent(id), {method:'DELETE', headers:SUPA_H})
      .then(function(r){ if(!r.ok) throw {code:'http_'+r.status}; return refresh(coll); });
  }
  // Synchronisation : recharge toutes les 15 s et quand on revient sur l'onglet (téléphone ↔ ordi)
  function refreshAll(){ Object.keys(subs).forEach(refresh); }
  setInterval(function(){ if(document.visibilityState==='visible') refreshAll(); }, 15000);
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') refreshAll(); });
  return {
    collection:function(name){ return {
      onSnapshot:function(ok, err){ sub(name, null, ok, err); },
      doc:function(id){ return {set:function(d){ return upsert(name, id, d); }, delete:function(){ return remove(name, id); }}; }
    }; },
    doc:function(path){ var p = path.split('/'); return {
      onSnapshot:function(ok, err){ sub(p[0], p[1], ok, err); },
      set:function(d){ return upsert(p[0], p[1], d); }
    }; }
  };
}

/* ---------- lien avec la plateforme DHA : modules faits ---------- */
var PLAT = {members:[], done:{}, loaded:false};
function normPseudo(p){ return String(p||'').trim().replace(/^@+/,'').toLowerCase(); }
function loadPlatform(){
  return fetch(SUPA_URL+'/rest/v1/membres?select=pseudo,prenom,nom,plan&or=(plan.is.null,plan.neq.demo)', {headers:SUPA_H})
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(ms){
      PLAT.members = Array.isArray(ms) ? ms : [];
      if(S.tab==='clients') schedule();
      var dl = document.getElementById('dhaMembers');
      if(dl) dl.innerHTML = PLAT.members.map(function(m){ return '<option value="'+esc(m.pseudo)+'">'+esc([m.prenom,m.nom].filter(Boolean).join(' '))+'</option>'; }).join('');
      var linked = S.clients.map(function(c){ return c.pseudo; }).filter(Boolean);
      if(!linked.length){ PLAT.loaded = true; return; }
      var keys = Object.keys(MOD_KEYS).map(function(k){ return MOD_KEYS[k]; }).filter(Boolean);
      var who = linked.map(function(p){ return '"'+String(p).replace(/"/g,'')+'"'; }).join(',');
      return fetch(SUPA_URL+'/rest/v1/xp_historique?membre_pseudo=in.('+encodeURIComponent(who)+')&action_key=in.('+keys.join(',')+')&select=membre_pseudo,action_key,created_at', {headers:SUPA_H})
        .then(function(r){ if(!r.ok) throw new Error('xp '+r.status); return r.json(); })
        .then(function(rows){
          var done = {};
          (Array.isArray(rows)?rows:[]).forEach(function(r){
            var k = normPseudo(r.membre_pseudo); done[k] = done[k] || {};
            var t = new Date(r.created_at).getTime();
            if(!done[k][r.action_key] || t<done[k][r.action_key]) done[k][r.action_key] = t;
          });
          PLAT.done = done; PLAT.loaded = true; syncModules();
        });
    }).catch(function(){});
}
function autoDone(c, n){ var key = MOD_KEYS[n]; if(!c.pseudo || !key) return null; return ((PLAT.done[normPseudo(c.pseudo)]||{})[key]) || null; }
function isAutoMod(c, n){ return !!(c && c.pseudo && MOD_KEYS[n]); }
var syncing = {};
function syncModules(){
  if(!PLAT.loaded || !dbh) return;
  S.clients.forEach(function(c){
    if(!c.pseudo || syncing[c.id]) return;
    // Client relié : la case « Fait » suit exactement la plateforme (modules validés = cochés, les autres = décochés)
    var mods = Object.assign({}, c.mods||{}), changed = false;
    for(var n=1;n<=MODULES;n++){
      if(!MOD_KEYS[n]) continue;
      var t = autoDone(c, n);
      if(t && !mods['v'+n]){ mods['v'+n] = t; changed = true; }
      else if(!t && mods['v'+n]){ mods['v'+n] = null; changed = true; }
    }
    if(!changed) return;
    syncing[c.id] = 1;
    put('clients', Object.assign({}, c, {mods:mods})).then(function(){ delete syncing[c.id]; }, function(){ delete syncing[c.id]; });
  });
}
var syncT = 0;
function queueSync(){ clearTimeout(syncT); syncT = setTimeout(function(){ migrateOffers(); syncModules(); }, 400); }
// Anciennes formules Basic / Premium → nouvelles formules (une seule fois)
var migrating = {};
function migrateOffers(){
  if(!dbh) return;
  S.clients.forEach(function(c){
    if(migrating[c.id]) return;
    var o = c.offer, n = null;
    if(o==='Basic') n = 'Essentiel 180€';
    else if(o==='Premium') n = (Number(c.price)||0)>=750 ? '1:1 750€' : 'Groupe 500€';
    if(!n) return;
    migrating[c.id] = 1;
    put('clients', Object.assign({}, c, {offer:n})).then(function(){ delete migrating[c.id]; }, function(){ delete migrating[c.id]; });
  });
}
function normName(t){ return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/^@+/,'').replace(/[\s._\-]+/g,''); }
// Trouve le compte de la plateforme qui correspond à une fiche client (pseudo, prénom ou prénom + nom)
function guessMember(c){
  var k = normName(c.name); if(!k) return [];
  return PLAT.members.filter(function(m){
    return normName(m.pseudo)===k || normName(m.prenom)===k || normName((m.prenom||'')+(m.nom||''))===k;
  });
}
function autoLinkClients(){
  var used = {}; S.clients.forEach(function(c){ if(c.pseudo) used[normPseudo(c.pseudo)] = 1; });
  var linked = [], manual = [];
  var chain = Promise.resolve();
  S.clients.filter(function(c){ return !c.pseudo; }).forEach(function(c){
    var g = guessMember(c).filter(function(m){ return !used[normPseudo(m.pseudo)]; });
    if(g.length===1){ used[normPseudo(g[0].pseudo)] = 1; linked.push(c.name+' → @'+g[0].pseudo); chain = chain.then(function(){ return put('clients', Object.assign({}, c, {pseudo:g[0].pseudo})); }); }
    else manual.push(c.name);
  });
  chain.then(function(){
    loadPlatform();
    openDlg('<div class="dlg-body"><h2 id="dlgTitle">Liaison des clients</h2>'
      +(linked.length ? '<p><b>'+linked.length+' client'+(linked.length>1?'s':'')+' relié'+(linked.length>1?'s':'')+' :</b></p><div class="tl">'+linked.map(function(t){ return '<div>'+esc(t)+'</div>'; }).join('')+'</div>' : '<p>Aucun client n\'a pu être relié automatiquement.</p>')
      +(manual.length ? '<p class="sub">À relier à la main (ouvre leur fiche et choisis leur pseudo) : <b>'+manual.map(esc).join(', ')+'</b>. Leur nom ne correspond à aucun compte, ou à plusieurs.</p>' : '')
      +'<p class="note">Vérifie les liaisons : si une est fausse, corrige le pseudo dans la fiche du client.</p></div>'
      +'<div class="dlg-foot"><span></span><div class="r"><button type="button" class="btn primary" data-act="close">OK</button></div></div>');
  }).catch(function(e){ toast(errCopy(e)); });
}

function connectCloud(db){
  S.mode = 'cloud'; dbh = db;
  ['prospects','content','clients','dmlogs'].forEach(function(name){
    db.collection(name).onSnapshot(function(snap){
      S[name] = snap.docs.map(function(d){ return Object.assign({}, d.data(), {id:d.id}); });
      S.error = ''; schedule();
      if(name==='clients'){ migrateOffers(); if(!PLAT.loaded) loadPlatform(); else queueSync(); }
    }, function(err){ S.error = 'Lecture impossible ('+(err&&err.code||'erreur')+')'; schedule(); });
  });
  db.doc('settings/targets').onSnapshot(function(snap){
    S.targets = Object.assign({}, DEFAULT_TARGETS, snap.exists ? snap.data() : {}); schedule();
  }, function(){});
  db.doc('settings/goals').onSnapshot(function(snap){
    S.goals = Object.assign({}, DEFAULT_GOALS, snap.exists ? snap.data() : {}); schedule();
  }, function(){});
  schedule();
}
function clean(o){ return JSON.parse(JSON.stringify(o)); }
function put(coll, obj){
  var id = obj.id, data = clean(Object.assign({}, obj)); delete data.id;
  if(dbh) return dbh.collection(coll).doc(id).set(data);
  local[coll][id] = data; persistLocal(); rebuildLocal(); schedule();
  return Promise.resolve();
}
function del(coll, id){
  if(dbh) return dbh.collection(coll).doc(id).delete();
  delete local[coll][id]; persistLocal(); rebuildLocal(); schedule();
  return Promise.resolve();
}
function saveGoals(g){
  if(dbh) return dbh.doc('settings/goals').set(clean(g));
  local.settings.goals = g; persistLocal(); rebuildLocal(); schedule();
  return Promise.resolve();
}
function saveTargets(t){
  if(dbh) return dbh.doc('settings/targets').set(clean(t));
  local.settings.targets = t; persistLocal(); rebuildLocal(); schedule();
  return Promise.resolve();
}
function errCopy(e){
  var c = e && e.code;
  if(c==='quota_exceeded') return 'Limite de fiches atteinte. Exporte en CSV puis supprime les plus anciennes.';
  if(c==='invalid_argument') return "Enregistrement refusé : tu n'as pas les droits d'écriture sur ces données.";
  if(c==='resource_exhausted') return 'Trop d’opérations d’un coup. Réessaie dans quelques secondes.';
  if(c==='http_404') return 'Table cerveau_docs introuvable : lance le script SQL dans Supabase.';
  if(c && String(c).indexOf('http_')===0) return 'Supabase a refusé l\'enregistrement ('+String(c).slice(5)+'). Vérifie que le projet n\'est pas en pause.';
  return "L'enregistrement a échoué. Réessaie.";
}
function safe(p){ return Promise.resolve(p).catch(function(e){ toast(errCopy(e)); throw e; }); }

/* ---------- calculs ---------- */
function monthStart(ts){ var d = new Date(ts); d.setDate(1); d.setHours(0,0,0,0); return d.getTime(); }
function dayStart(ts){ var d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function since(){
  var now = Date.now();
  if(S.period==='today') return dayStart(now);
  if(S.period==='week') return weekStart(now);
  if(S.period==='month') return monthStart(now);
  if(S.period==='lastmonth') return monthStart(monthStart(now)-1);
  return 0;
}
function until(){ return S.period==='lastmonth' ? monthStart(Date.now()) : Infinity; }
function prospectsIn(){ var s = since(), u = until(); return S.prospects.filter(function(p){ var v = p.dmAt||0; return v>=s && v<u; }); }
function platParts(c){
  var mk = function(name, o){ return {platform:name, views:Number(o.views)||0, saves:Number(o.saves)||0, leads:Number(o.leads)||0, clients:Number(o.clients)||0}; };
  if(c.platform==='Les deux') return [mk('Instagram', c.ig||{}), mk('TikTok', c.tt||{})];
  return [mk(c.platform, c)];
}
function allLogs(){
  var v = [];
  S.content.forEach(function(c){ platParts(c).forEach(function(pt,i){ if(pt.leads>0) v.push({id:'ebook-'+c.id+'-'+i, count:pt.leads, date:c.date, source:EBOOK, variant:'Envoi ebook', platform:pt.platform, virtual:true}); }); });
  return S.dmlogs.concat(v);
}
function logsIn(){ var s = since(), u = until(); return allLogs().filter(function(l){ var v = l.date||0; return v>=s && v<u; }); }
function monthOf(c){ return Math.floor((Date.now()-(c.startAt||Date.now()))/(30*DAY))+1; }
function stepsDone(c){ var n = 0; ONB.forEach(function(k){ if((c.onb||{})[k[0]]) n++; }); MILES.forEach(function(k){ if((c.mil||{})[k[0]]) n++; }); return n; }
function paidOf(c){ return c.payMulti ? (c.payments||[]).reduce(function(t,x){ return t+(Number(x.amount)||0); },0) : (Number(c.price)||0); }
function remainingOf(c){ return Math.max(0, (Number(c.price)||0) - paidOf(c)); }
function modsDoneCount(c){ var n = 0, m = c.mods||{}; for(var i=1;i<=MODULES;i++){ if(isAutoMod(c,i) ? autoDone(c,i) : m['v'+i]) n++; } return n; }
function modsMastered(c){ var n = 0, m = c.mods||{}; for(var i=1;i<=MODULES;i++){ if(m['x'+i]) n++; } return n; }
function lastTouch(c){ var l = (c.checkins||[])[0]; return (l && l.at) || c.startAt || Date.now(); }
function lateInfo(c){
  var m = monthOf(c), mil = c.mil||{}, onb = c.onb||{};
  if(Date.now()-(c.startAt||Date.now()) > 7*DAY && !onb.awareness) return 'Prise de conscience non terminée';
  for(var i=1;i<=4;i++){ if(m>i && !mil['m'+i]) return 'En retard sur le mois '+i; }
  return '';
}
function contentIn(){ var s = since(), u = until(); return S.content.filter(function(c){ var v = c.date||0; return v>=s && v<u; }); }
function sumLogs(logs){ return logs.reduce(function(t,l){ return t + (Number(l.count)||0); }, 0); }
function funnelOf(list, logs){
  return {
    sent: sumLogs(logs||[]) + list.filter(function(p){return !p.repliedAt;}).length,
    replied:list.filter(function(p){return p.repliedAt;}).length,
    call:list.filter(function(p){return p.callAt;}).length,
    held:list.filter(function(p){return p.heldAt || p.wonAt;}).length,
    won:list.filter(function(p){return p.wonAt;}).length
  };
}
function reachedIdx(p){ return p.wonAt?4 : p.heldAt?3 : p.callAt?2 : p.repliedAt?1 : 0; }
function needsFollowUp(p){
  if(p.status==='perdu' || p.status==='close') return false;
  if(p.relance) return true;
  return p.status==='reponse' && (Date.now()-(p.lastRelanceAt||p.repliedAt||p.dmAt||0)) >= 3*DAY;
}
var PERIOD_LABEL = {today:"aujourd'hui", week:'cette semaine', month:'ce mois-ci', lastmonth:'le mois dernier', all:'depuis le début'};
function periodLabel(){ return PERIOD_LABEL[S.period] || 'sur la période'; }

function analyse(){
  var list = prospectsIn(), logs = logsIn(), f = funnelOf(list, logs), t = S.targets;
  var steps = [
    {k:'replied', label:'Taux de réponse', n:f.replied, from:f.sent, target:t.reply, what:'des DM reçoivent une réponse'},
    {k:'call', label:'Réponse vers call', n:f.call, from:f.replied, target:t.call, what:'des réponses débouchent sur un call'},
    {k:'held', label:'Calls réalisés', n:f.held, from:f.call, target:t.show, what:'des calls bookés ont bien lieu'},
    {k:'won', label:'Call réalisé vers client', n:f.won, from:f.held, target:t.close, what:'des calls réalisés se transforment en client'}
  ].map(function(s){ s.rate = rate(s.n, s.from); return s; });
  var weak = null;
  steps.forEach(function(s){
    if(s.from>=5 && s.rate!=null && s.target>0){
      var r = s.rate/s.target;
      if(r<1 && (!weak || r<weak.r)) weak = Object.assign({}, s, {r:r});
    }
  });
  var gain = null;
  if(weak && steps.every(function(s){return s.rate!=null;})){
    var sim = f.sent;
    steps.forEach(function(s){ sim *= (s.k===weak.k ? s.target : s.rate)/100; });
    gain = sim - f.won;
  }
  return {list:list, logs:logs, f:f, steps:steps, weak:weak, gain:gain};
}

function groupBy(list, logs, keyFn){
  var m = {};
  var get = function(k){ k = k || 'Non renseigné'; return m[k] = m[k] || {k:k, sent:0, replied:0, call:0, held:0, won:0}; };
  logs.forEach(function(l){ get(keyFn(l)).sent += Number(l.count)||0; });
  list.forEach(function(p){ var o = get(keyFn(p)); if(!p.repliedAt) o.sent++; if(p.repliedAt) o.replied++; if(p.callAt) o.call++; if(p.heldAt||p.wonAt) o.held++; if(p.wonAt) o.won++; });
  return Object.keys(m).map(function(k){ return m[k]; }).sort(function(a,b){ return b.sent-a.sent; });
}

var GOAL_DEFS = [
  {k:'content', label:'Contenus publiés', short:'contenus', note:''},
  {k:'dm', label:'DM envoyés', short:'DM', note:'hors ebooks'},
  {k:'held', label:'Calls faits', short:'calls faits', note:''}
];
var DAYS_FR = ['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'];
function goalCount(k, a, b){
  var inr = function(t){ return t>=a && t<b; };
  if(k==='content') return S.content.filter(function(c){ return inr(c.date||0); }).length;
  if(k==='dm') return sumLogs(S.dmlogs.filter(function(l){ return inr(l.date||0); }));
  if(k==='held') return S.prospects.filter(function(p){ return p.heldAt && inr(p.heldAt); }).length;
}
function dayTs(ws, i){ var d = new Date(ws); d.setDate(d.getDate()+i); return d.getTime(); }
function weekGoalsPct(){
  var defs = GOAL_DEFS.filter(function(g){ return Number(S.goals[g.k])>0; });
  if(!defs.length) return null;
  var ws = weekStart(Date.now()), sum = 0;
  defs.forEach(function(g){
    var t = Number(S.goals[g.k]), total = 0;
    for(var j=0;j<7;j++){ total += goalCount(g.k, dayTs(ws,j), dayTs(ws,j+1)); }
    sum += Math.min(100, total/t*100);
  });
  return Math.round(sum/defs.length);
}

function paintGoals(){
  if(!$('#goals')) return;
  var d0 = new Date(weekStart(Date.now())); d0.setDate(d0.getDate()+7*S.weekOffset);
  var ws = d0.getTime(), now = Date.now(), cur = S.weekOffset===0, todayIdx = 0, i;
  if(cur){ for(i=0;i<7;i++){ if(now>=dayTs(ws,i) && now<dayTs(ws,i+1)) todayIdx = i; } }
  $('#gnav').innerHTML = '<div class="seg" role="group" aria-label="Changer de semaine"><button type="button" data-act="week-prev">Semaine précédente</button><button type="button" data-act="week-next"'+(cur?' disabled':'')+'>Semaine suivante</button></div>'
    +'<span class="sub">'+(cur?'Cette semaine, du ':'Semaine du ')+dShort(ws)+' au '+dShort(dayTs(ws,6))+'</span>';
  var defs = GOAL_DEFS.filter(function(g){ return Number(S.goals[g.k])>0; });
  if(!defs.length){
    $('#goals').innerHTML = '<div class="card empty" style="grid-column:1/-1">Aucun objectif défini. Clique sur « Modifier mes objectifs » pour en fixer un.</div>';
    $('#gnote').textContent = ''; return;
  }
  $('#goals').innerHTML = defs.map(function(g){
    var t = Number(S.goals[g.k]), counts = [], total = 0, n;
    for(var j=0;j<7;j++){ n = goalCount(g.k, dayTs(ws,j), dayTs(ws,j+1)); counts.push(n); total += n; }
    var pc = Math.round(total/t*100), done = total>=t, daily = t>=7 ? Math.round(t/7) : 0;
    var mark = (cur && !done) ? '<em class="mark" style="left:calc('+((todayIdx+1)/7*100)+'% - 2px)"></em>' : '';
    var pace;
    if(done){
      pace = '<span class="ok">Objectif de la semaine atteint.</span>'+(total>t?' Tu l\'as dépassé de '+fmtN(total-t)+'.':'');
    }else if(cur){
      var expected = t*todayIdx/7, late = expected-total, remaining = t-total, left = 7-todayIdx;
      pace = (late>0.5 ? '<span class="late">En retard de '+fmtN(Math.ceil(late))+' '+g.short+'.</span>' : '<span class="ok">Dans le rythme.</span>')
        +' Il reste '+fmtN(remaining)+' '+g.short+' à faire en '+left+' jour'+(left>1?'s':'')+', soit environ '+fmtN(Math.ceil(remaining/left))+' par jour.';
    }else{
      pace = '<span class="late">Objectif manqué.</span> Tu as réalisé '+pc+' % de l\'objectif.';
    }
    var today = '';
    if(cur && daily>0){
      var tn = counts[todayIdx], tp = Math.min(100, Math.round(tn/daily*100));
      today = '<div><div class="today-h"><span>Aujourd\'hui</span><b>'+fmtN(tn)+' / '+fmtN(daily)+'</b></div><div class="gauge small'+(tn>=daily?' done':'')+'" role="progressbar" aria-label="Aujourd\'hui, '+esc(g.label)+'" aria-valuemin="0" aria-valuemax="'+daily+'" aria-valuenow="'+tn+'"><i style="width:'+tp+'%"></i></div></div>';
    }
    var maxc = Math.max(1, Math.max.apply(null, counts));
    var cols = counts.map(function(c, k){
      var future = cur && k>todayIdx;
      var h = daily ? Math.min(100, c/(daily*1.5)*100) : c/maxc*100;
      return '<div class="day'+(k===todayIdx && cur?' today':'')+'"><div class="dbar">'+(daily?'<span class="line" style="bottom:66.7%"></span>':'')+'<i class="'+(daily && c>=daily?'hit':'')+'" style="height:'+(future?0:h)+'%"></i></div><b>'+c+'</b><span>'+DAYS_FR[k]+'</span></div>';
    }).join('');
    return '<section class="card goal"><div><h2>'+esc(g.label)+'</h2><p class="sub">Objectif : '+fmtN(t)+' par semaine'+(daily?', environ '+daily+' par jour':'')+(g.note?' ('+g.note+')':'')+'</p></div>'
      +'<div class="goal-main"><b>'+fmtN(total)+'</b><span class="of">/ '+fmtN(t)+'</span><span class="pc">'+pc+'&nbsp;%</span></div>'
      +'<div class="gauge'+(done?' done':'')+'" role="progressbar" aria-label="Semaine, '+esc(g.label)+'" aria-valuemin="0" aria-valuemax="'+t+'" aria-valuenow="'+total+'"><i style="width:'+Math.min(100,pc)+'%"></i>'+mark+'</div>'
      +'<p class="pace">'+pace+'</p>'+today+'<div class="days">'+cols+'</div></section>';
  }).join('');
  $('#gnote').textContent = (cur ? 'Le trait bleu sur la jauge marque où tu devrais en être à la fin d\'aujourd\'hui. ' : '')+'L\'objectif par jour est l\'objectif de la semaine divisé par 7. Les DM comptés sont ceux de l\'onglet Prospects, hors ebooks. Chaque entrée de l\'onglet Contenu compte pour un contenu.';
}

function parseHandles(txt){
  var seen = {}, out = [];
  txt.split(/[\n,;]+/).forEach(function(raw){
    var h = raw.trim().replace(/^https?:\/\/(www\.)?(instagram|tiktok)\.com\/@?/i,'').replace(/[\/?].*$/,'').replace(/^@+/,'').trim();
    if(h && !seen[h.toLowerCase()]){ seen[h.toLowerCase()] = 1; out.push(h); }
  });
  return out;
}
function submitReplies(){
  var handles = parseHandles($('#qaHandles').value);
  if(!handles.length){ $('#qaHint').textContent = 'Colle au moins un pseudo.'; $('#qaHandles').focus(); return; }
  var platform = $('#qaPlat').value, source = $('#qaSrc').value, variant = ($('#qaVar').value||'').trim() || 'Sans script';
  var revenu = $('#qaRev').value || null, objectif = ($('#qaObj').value||'').trim(), notesIn = $('#qaNotes').value || '';
  var at = fromYmd($('#qaDate').value), now = Date.now();
  rememberQa({platform:platform, source:source, variant:variant});
  var exist = {}; S.prospects.forEach(function(p){ exist[(p.platform||'')+'|'+String(p.handle).toLowerCase()] = 1; });
  var fresh = handles.filter(function(h){ return !exist[platform+'|'+h.toLowerCase()]; });
  var skipped = handles.length - fresh.length;
  var items = fresh.map(function(h){
    return {id:uid(), handle:h, platform:platform, source:source, variant:variant, status:'reponse', dmAt:at, repliedAt:now, callAt:null, wonAt:null, lostAt:null, lostStage:null, lostReason:'', notes:notesIn, objectif:objectif, clientId:null, revenu:revenu};
  });

  var chain = Promise.resolve();

    (function(chunk){ chain = chain.then(function(){ return Promise.all(chunk.map(function(o){ return put('prospects',o); })); }); })(items.slice(i,i+5));
  }
  chain.then(function(){
    if(btn) btn.disabled = false;
    toast(items.length===1 ? '@'+items[0].handle+' ajouté' : items.length+' prospects ajoutés'+(skipped?' ('+skipped+' déjà dans la liste)':''));
    closeDlg();
  }).catch(function(e){ if(btn) btn.disabled = false; toast(errCopy(e)); });
}

function paintProspects(){
  if(!$('#plist')) return;
  var dl = $('#variants');
  if(dl){ var vs = {}; S.prospects.concat(S.dmlogs).forEach(function(p){ if(p.variant) vs[p.variant]=1; }); dl.innerHTML = Object.keys(vs).map(function(v){ return '<option value="'+esc(v)+'">'; }).join(''); }

  var openProspects = S.prospects.filter(function(p){ return p.status!=='close'; });
  // Filtres : plusieurs choix possibles. Dans un même groupe = OU, entre les groupes = ET.
  var GROUPS = [
    ['act','À faire',[['contact','À contacter'],['relance','À relancer']]],
    ['stage','Étape',[['reponse','Répondu'],['call','Call booké'],['held','Call fait'],['perdu','Perdu']]],
    ['rev','Revenus',[['sdr','SDR'],['sr','SR'],['none','Non renseigné']]],
    ['src','Source',SOURCES.map(function(x){ return [x, x===EBOOK?'Ebook':x.replace('Like ou abonné de ','Like/abo ')]; })]
  ];
  var test = {
    act:function(p,v){ return v==='contact' ? prospectDue(p) : needsFollowUp(p); },
    stage:function(p,v){ return p.status===v; },
    rev:function(p,v){ return v==='none' ? !p.revenu : p.revenu===v; },
    src:function(p,v){ return p.source===v; }
  };
  var q = S.q.trim().toLowerCase();
  function matches(p, skip){
    if(S.funnelView){ var fld = {replied:'repliedAt',call:'callAt',held:'heldAt',won:'wonAt'}[S.funnelView]; if(fld && !p[fld]) return false; }
    for(var g in S.pf){ if(g===skip) continue; var vals = S.pf[g]||[]; if(vals.length && !vals.some(function(v){ return test[g](p,v); })) return false; }
    if(q && (String(p.handle).toLowerCase().indexOf(q)<0 && String(p.notes||'').toLowerCase().indexOf(q)<0 && String(p.objectif||'').toLowerCase().indexOf(q)<0)) return false;
    return true;
  }
  var active = Object.keys(S.pf).reduce(function(t,g){ return t+(S.pf[g]||[]).length; },0);
  var STAGE_VIEW_LABEL = {replied:'Réponses obtenues', call:'Calls bookés', held:'Calls réalisés'};
  var h = '<button type="button" class="ftoggle" data-act="pf-toggle" aria-expanded="'+S.pfOpen+'"><span>⚙️ Filtres'+(active?' <b class="fon">'+active+' actif'+(active>1?'s':'')+'</b>':'')+'</span><span aria-hidden="true">'+(S.pfOpen?'▲':'▼')+'</span></button>';
  h += '<div class="fbody"'+(S.pfOpen?'':' hidden')+'>'+GROUPS.map(function(G){
    return '<div class="frow"><span class="flbl">'+G[1]+'</span>'+G[2].map(function(o){
      var on = (S.pf[G[0]]||[]).indexOf(o[0])>=0;
      var n = openProspects.filter(function(p){ return matches(p, G[0]) && test[G[0]](p, o[0]); }).length;
      return '<button type="button" class="chip" data-act="pf" data-g="'+G[0]+'" data-v="'+esc(o[0])+'" aria-pressed="'+on+'">'+esc(o[1])+'<small>'+n+'</small></button>';
    }).join('')+'</div>';
  }).join('')+'</div>';
  var list = openProspects.filter(function(p){ return matches(p, null); });
  h += '<div class="fbar"><span class="fcount">'+list.length+' prospect'+(list.length>1?'s':'')+(active||S.funnelView?' avec ces filtres':'')+'</span><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    +(active?'<button type="button" class="iconbtn" data-act="pf-clear">Effacer les filtres</button>':'')
    +'<label for="psort" class="sr">Trier</label><select id="psort">'+[['recent','Plus récents d\'abord'],['old','Plus anciens d\'abord'],['launch','Lancement le plus proche'],['touch','Sans contact depuis le plus longtemps']].map(function(o){ return '<option value="'+o[0]+'"'+(S.sort===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select></span></div>';
  $('#pchips').innerHTML = h;
  var pb = $('#pbanner');
  if(pb) pb.innerHTML = S.funnelView ? '<div class="note" style="margin-bottom:10px">Vue depuis l\'entonnoir : <b>'+esc(STAGE_VIEW_LABEL[S.funnelView]||'')+'</b>. <button type="button" class="iconbtn" data-act="funnel-off">Revenir à tous les prospects</button></div>' : '';
  var addedAt = function(p){ return p.repliedAt || p.dmAt || 0; };
  list.sort(function(a,b){
    if(S.sort==='old') return addedAt(a)-addedAt(b);
    if(S.sort==='launch'){ var al = a.launchAt||Infinity, bl = b.launchAt||Infinity; if(al!==bl) return al-bl; return addedAt(b)-addedAt(a); }
    if(S.sort==='touch') return prospectLastTouch(a)-prospectLastTouch(b);
    return addedAt(b)-addedAt(a);
  });
  if(!list.length){
    $('#plist').innerHTML = '<div class="empty">'+(S.prospects.length ? 'Aucun prospect ne correspond à ce filtre.' : 'Aucun prospect pour le moment. Quand quelqu\'un répond à un DM, ajoute son pseudo ci-dessus.')+'</div>';
    return;
  }
  var shown = list.slice(0, S.limit);
  $('#plist').innerHTML = shown.map(prow).join('') + (list.length>shown.length ? '<div style="padding-top:14px;text-align:center"><button type="button" class="btn" data-act="more">Afficher '+Math.min(60,list.length-shown.length)+' de plus</button></div>' : '');
}

  var relBtn = '<div class="p-actions">'+relInner+'<button type="button" class="btn small" data-act="details-p" data-id="'+esc(p.id)+'">Voir les détails</button><button type="button" class="iconbtn" data-act="del-p" data-id="'+esc(p.id)+'">Supprimer</button></div>';
  var due = prospectDue(p), active = prospectActive(p), left = prospectCadenceLeft(p);

  }
  var when = 'Réponse '+ago(p.repliedAt||p.dmAt||Date.now()) + (fu?'<span class="badge">À relancer</span>':'') + (due?'<span class="badge">À contacter</span>':'') + (p.clientId && p.status==='close'?'<span class="badge ok">Fiche client</span>':'') + cadence + relBtn;

    + (p.status!=='perdu' && p.status!=='close' ? '<button type="button" class="iconbtn" data-act="stage" data-id="'+esc(p.id)+'" data-stage="perdu">Perdu</button>' : '')
    + '<button type="button" class="iconbtn" data-act="toggle-steps" data-id="'+esc(p.id)+'">'+(expanded?'Masquer les étapes':'Modifier l\'étape')+'</button></div>';
  var stepsBlock = expanded ? '<div class="steps" role="group" aria-label="Étape de @'+esc(p.handle)+'">'+btns+'</div>' : '';
  return '<article class="prow"><div><button type="button" class="p-handle" data-act="edit-p" data-id="'+esc(p.id)+'">@'+esc(p.handle)+'</button><span class="p-meta">'+meta+'</span>'+revBtn+'</div>'
    +quickStep+stepsBlock+'<div class="p-when">'+when+'</div>'+(p.notes?'<div class="p-note">'+esc(p.notes)+'</div>':'')+'</article>';

function copyText(txt){
  var done = function(){ toast('Chiffres copiés. Colle-les dans une conversation avec Claude.'); };
  var fallback = function(){ var b = $('#aiCopyBox'); if(!b) return; b.value = txt; b.classList.remove('sr'); b.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('Sélectionne le texte et copie-le.'); } };
  try{ navigator.clipboard.writeText(txt).then(done, fallback); }catch(e){ fallback(); }
}

/* ---------- toast ---------- */
var toastT = 0;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 3800);
}

/* ---------- événements ---------- */
var armT = 0;
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]'); if(!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  var byId = function(list){ return list.filter(function(x){ return x.id===id; })[0]; };
  switch(act){
    case 'tab': S.tab = el.getAttribute('data-tab'); render(); window.scrollTo(0,0); break;
    case 'period': S.period = el.getAttribute('data-v'); render(); break;
    case 'add-dm': S.tab = 'prospects'; render(); setTimeout(function(){ openDmLogDialog(); }, 30); break;
    case 'open-dmlog': openDmLogDialog(); break;
    case 'open-reply': openReplyDialog(); break;
    case 'submit-dmlog': submitDmLog(); break;
    case 'submit-reply': submitReplies(); break;
    case 'del-log': if(el.getAttribute('data-armed')){ safe(del('dmlogs', id)).catch(function(){}); } else { el.setAttribute('data-armed','1'); el.textContent = 'Confirmer'; clearTimeout(armT); armT = setTimeout(function(){ el.removeAttribute('data-armed'); el.textContent = 'Supprimer'; }, 4000); } break;
    case 'goto-relance': S.tab = 'prospects'; S.pf = {act:['relance'], stage:[], rev:[], src:[]}; S.funnelView = null; savePf(); S.limit = 60; render(); break;
    case 'goto-stage': S.tab = 'prospects'; S.funnelView = el.getAttribute('data-stage'); S.limit = 60; render(); break;
    case 'all-prospects': S.tab = 'prospects'; S.funnelView = null; S.limit = 60; render(); break;
    case 'pf':
      var g = el.getAttribute('data-g'), v = el.getAttribute('data-v'), arr = (S.pf[g]||[]).slice(), i0 = arr.indexOf(v);
      if(i0>=0) arr.splice(i0,1); else arr.push(v);
      S.pf[g] = arr; S.limit = 60; savePf(); paintProspects(); break;
    case 'pf-toggle': S.pfOpen = !S.pfOpen; paintProspects(); break;
    case 'pf-clear': S.pf = {act:[], stage:[], rev:[], src:[]}; S.limit = 60; savePf(); paintProspects(); break;
    case 'funnel-off': S.funnelView = null; paintProspects(); break;
    case 'debtors': openDebtors(); break;
    case 'open-client-from-debt': var dc = S.clients.filter(function(x){ return x.id===id; })[0]; if(dc) openClient(dc); break;
    case 'filter': S.filter = el.getAttribute('data-f'); S.limit = 60; paintProspects(); break;
    case 'more': S.limit += 60; paintProspects(); break;
    case 'stage': changeStage(id, el.getAttribute('data-stage')); break;
    case 'cycle-rev':
      var rp2 = byId(S.prospects); if(!rp2) break;
      var revOrder = [null,'sdr','sr'], curRev = revOrder.indexOf(rp2.revenu||null), nextRev = revOrder[(curRev+1)%revOrder.length];
      safe(put('prospects', Object.assign({}, rp2, {revenu:nextRev}))).catch(function(){});
      break;
    case 'toggle-steps': S.expandedSteps[id] = !S.expandedSteps[id]; paintProspects(); break;
    case 'del-p':
      if(el.getAttribute('data-armed')){ deleteProspect(id); }
      else { el.setAttribute('data-armed','1'); el.textContent = 'Confirmer'; clearTimeout(armT); armT = setTimeout(function(){ el.removeAttribute('data-armed'); el.textContent = 'Supprimer'; }, 4000); }
      break;
    case 'relance':
      var rp = byId(S.prospects); if(!rp) break;
      var rq = Object.assign({}, rp), was = needsFollowUp(rp);
      if(was){ rq.relance = false; rq.lastRelanceAt = Date.now(); } else { rq.relance = true; }
      safe(put('prospects', rq)).then(function(){ toast(was ? 'Marqué comme relancé' : 'Marqué à relancer'); }).catch(function(){});
      break;
    case 'edit-p': var p = byId(S.prospects); if(p) openProspect(p, el.getAttribute('data-act')==='edit-p' && el.closest('.p-actions')); break;
    case 'details-p': openProspectDetails(id); break;
    case 'add-pint':
      var pin = $('#pdINote').value.trim();
      draft.interactions = [{at:Date.now(), type:$('#pdIType').value, note:pin}].concat(draft.interactions||[]);
      $('#pdINote').value = ''; paintPTimeline(); break;
    case 'save-pd': saveProspectDetails(); break;
    case 'save-p': saveProspect(); break;
    case 'del-c': if(el.getAttribute('data-armed')){ safe(del('content', id)).catch(function(){}); } else { el.setAttribute('data-armed','1'); el.textContent = 'Confirmer'; clearTimeout(armT); armT = setTimeout(function(){ el.removeAttribute('data-armed'); el.textContent = 'Supprimer'; }, 4000); } break;
    case 'del-arm':
      if(el.getAttribute('data-armed')){
        var kind = el.getAttribute('data-kind');
        safe(del(kind==='p'?'prospects':'clients', draft.id)).then(closeDlg).catch(function(){});
      }else{ el.setAttribute('data-armed','1'); el.textContent = 'Confirmer la suppression'; clearTimeout(armT); armT = setTimeout(function(){ el.removeAttribute('data-armed'); el.textContent = 'Supprimer'; }, 4000); }
      break;
    case 'close': closeDlg(); break;
    case 'new-client': openClient({id:uid(), name:'', status:'actif', price:0, goal:'', offer:'', startAt:Date.now(), checkins:[], onb:{}, mil:{}, demoGoal:'', rdv:false, prospectId:null}); break;
    case 'open-client': var c = byId(S.clients); if(c) openClient(c); break;
    case 'add-checkin':
      var note = $('#cdNote').value.trim();
      draft.checkins = [{at:Date.now(), type:$('#cdType').value, note:note}].concat(draft.checkins||[]);
      $('#cdNote').value = ''; paintTimeline(); break;
    case 'add-pay':
      var amt = Number($('#cdPayAmt').value)||0;
      if(amt<=0){ $('#cdPayAmt').focus(); break; }
      draft.payments = (draft.payments||[]).concat([{at:fromYmd($('#cdPayDate').value), amount:amt}]).sort(function(a,b){ return b.at-a.at; });
      $('#cdPayAmt').value = ''; paintPay(); break;
    case 'del-pay': (draft.payments||[]).splice(Number(el.getAttribute('data-i')),1); paintPay(); break;
    case 'save-c': saveClient(); break;
    case 'auto-link': autoLinkClients(); break;
    case 'week-prev': S.weekOffset--; paintGoals(); break;
    case 'week-next': if(S.weekOffset<0){ S.weekOffset++; paintGoals(); } break;
    case 'goals': openGoals(); break;
    case 'save-g':
      var ng = {}; GOAL_DEFS.forEach(function(d){ ng[d.k] = Math.max(0, Math.floor(Number($('#gl_'+d.k).value)||0)); });
      safe(saveGoals(ng)).then(closeDlg).catch(function(){}); break;
    case 'targets': openTargets(); break;
    case 'save-t':
      var t = {reply:Number($('#tgR').value)||DEFAULT_TARGETS.reply, call:Number($('#tgC').value)||DEFAULT_TARGETS.call, show:Number($('#tgS').value)||DEFAULT_TARGETS.show, close:Number($('#tgW').value)||DEFAULT_TARGETS.close};
      safe(saveTargets(t)).then(closeDlg).catch(function(){}); break;
    case 'export': exportCsv(el.getAttribute('data-kind')); break;
    case 'ai-run': runAI(''); break;
    case 'ai-ask': var qv = ($('#aiQ')||{}).value; if(qv && qv.trim()) runAI(qv.trim()); else if($('#aiQ')) $('#aiQ').focus(); break;
    case 'ai-stop': if(aiCtl) aiCtl.abort(); break;
    case 'ai-copy': runAI((($('#aiQ')||{}).value||'').trim(), true); break;
  }
});
document.addEventListener('change', function(ev){
  var el = ev.target;
  if(el && el.id==='psort'){ S.sort = el.value; S.limit = 60; savePf(); paintProspects(); return; }
  if(el.getAttribute && el.getAttribute('data-act')==='num'){
    var c = S.content.filter(function(x){ return x.id===el.getAttribute('data-id'); })[0]; if(!c) return;
    var o = Object.assign({}, c), path = el.getAttribute('data-field'), val = Math.max(0, Number(el.value)||0);
    if(path.indexOf('.')>0){
      var pr = path.split('.'), sub = Object.assign({}, o[pr[0]]); sub[pr[1]] = val; o[pr[0]] = sub;
      METRICS.forEach(function(m){ o[m[0]] = (Number((o.ig||{})[m[0]])||0) + (Number((o.tt||{})[m[0]])||0); });
    }else{ o[path] = val; }
    safe(put('content', o)).catch(function(){});
  }
});
document.addEventListener('input', function(ev){
  if(ev.target && ev.target.id==='pq'){ S.q = ev.target.value; S.limit = 60; paintProspects(); }
  if(ev.target && ev.target.id==='aiQ'){ /* rien */ }
});
document.addEventListener('keydown', function(ev){
  if(ev.key==='Enter' && ev.target && ev.target.id==='aiQ'){ ev.preventDefault(); var v = ev.target.value.trim(); if(sampleFn){ if(v) runAI(v); } else runAI(v, true); }
  if(ev.key==='Enter' && ev.target && ev.target.id==='cdPayAmt'){ ev.preventDefault(); var pb = $('[data-act="add-pay"]'); if(pb) pb.click(); }
  if(ev.key==='Enter' && ev.target && ev.target.id==='cdNote'){ ev.preventDefault(); var b = $('[data-act="add-checkin"]'); if(b) b.click(); }
});

/* ---------- démarrage ---------- */
var SKEL = {funnel:skelFunnel, objectifs:skelGoals, launches:skelLaunches, prospects:skelProspects, content:skelContent, clients:skelClients, brain:skelBrain};
var PAINT = {funnel:paintFunnel, objectifs:paintGoals, launches:paintLaunches, prospects:paintProspects, content:paintContent, clients:paintClients, brain:function(){}};

function use(name){
  try{ if(window.claude && typeof window.claude.use==='function') return Promise.resolve(window.claude.use(name)).catch(function(){ return null; }); }catch(e){}
  return Promise.resolve(null);
}
// Export CSV : téléchargement direct depuis le navigateur
dlNs = {save:function(o){
  var url = URL.createObjectURL(new Blob([o.data], {type:'text/csv;charset=utf-8'}));
  var a = document.createElement('a'); a.href = url; a.download = o.filename; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
  return Promise.resolve();
}};
var PASS = '050876';

  $('#gate').remove();
  render();
  connectCloud(makeSupaDb());
  setInterval(loadPlatform, 60000);
}

if(okSession) start();
else {

  });
}
})();
