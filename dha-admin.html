<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHA — Membres (admin)</title>
<meta name="robots" content="noindex,nofollow">
<script src="dha-api.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050914;--s:#0c1220;--s2:#111827;--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);--tx:#e8f4ff;--mu:rgba(232,244,255,.5);--cy:#00d4ff;--go:#ffd700;--gr:#00e676;--re:#ff4455;--or:#ff9800}
body{background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.st b{display:block;font-size:18px}.st span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
.bar{display:flex;gap:8px;margin-bottom:10px}
.in{background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:10px 12px;outline:none;min-width:0}
.in:focus{border-color:var(--cy)}
#q{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:transparent;border:1px solid var(--bd2);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--mu)}
.chip.on{background:rgba(0,212,255,.12);border-color:var(--cy);color:var(--tx)}
.chip.warn{border-color:rgba(255,215,0,.6);color:var(--go)}
.card{background:var(--s);border:1px solid var(--bd);border-radius:14px;margin-bottom:8px;overflow:hidden}
.card.op{border-color:rgba(0,212,255,.35)}
.head{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.av{width:38px;height:38px;border-radius:50%;background:rgba(0,212,255,.12);color:var(--cy);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.who{flex:1;min-width:0}
.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:45%}
.tag{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.06);white-space:nowrap}
.t-xp{color:var(--go)}.t-demo{color:var(--go);background:rgba(255,215,0,.1)}.t-val{color:#111;background:var(--go)}.t-enc{color:var(--or);background:rgba(255,152,0,.1)}.t-off{color:var(--mu)}
.body{padding:0 12px 14px;display:none}
.card.op .body{display:block}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--mu);padding:10px 0 4px;border-top:1px solid var(--bd)}
.meta b{color:var(--tx);font-weight:600}
h4{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);margin:16px 0 8px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.act{position:relative;display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;text-align:left;font-size:12.5px}
.act:active{transform:scale(.98)}
.act i{font-style:normal;font-size:16px}
.act span{flex:1;line-height:1.25}
.act em{font-style:normal;color:var(--go);font-size:11.5px;font-weight:700;white-space:nowrap}
.act.sel{border-color:var(--go);background:rgba(255,215,0,.07)}
.act .n{position:absolute;top:-6px;right:-6px;background:var(--go);color:#111;border-radius:999px;font-size:11px;font-weight:800;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.pan{margin-top:8px;background:rgba(255,215,0,.05);border:1px solid rgba(255,215,0,.3);border-radius:10px;padding:10px}
.pl{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0}
.pl button{background:none;border:1px solid var(--bd2);border-radius:6px;width:24px;height:24px;line-height:1}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .in{padding:8px 10px}
.btn{border:1px solid var(--bd2);background:var(--s2);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.b-ok{background:var(--gr);border-color:var(--gr);color:#04140a}
.b-go{background:var(--go);border-color:var(--go);color:#111}
.b-ghost{background:transparent}
.b-red{color:var(--re);border-color:rgba(255,68,85,.4);background:transparent}
.money{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.money div{background:var(--s2);border-radius:10px;padding:10px}
.money b{display:block;font-size:18px}.money span{font-size:11px;color:var(--mu)}
.hist{font-size:12.5px}
.hl{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--bd)}
.hl:last-child{border:0}
.hl time{color:var(--mu);font-size:11.5px;white-space:nowrap;min-width:72px}
.hl span{flex:1;overflow-wrap:anywhere}
.hl b{white-space:nowrap}.pos{color:var(--gr)}.neg{color:var(--re)}
.box{background:var(--s2);border-radius:10px;padding:10px;font-size:12.5px}
.rib{font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px;overflow-wrap:anywhere}
.mu{color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#dlg.on{display:flex}
#dlg .dl{background:var(--s);border:1px solid var(--bd2);border-radius:16px;padding:18px;max-width:420px;width:100%}
#dlg h3{font-size:15px;margin-bottom:10px}
#dlg .tx{white-space:pre-line;font-size:13px;color:var(--mu);margin-bottom:12px}
#dlg textarea{width:100%;min-height:60px;resize:vertical;margin-bottom:12px}
#dlg .row{justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(80px);background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:10px 16px;font-size:13px;transition:transform .25s;z-index:60;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--gr)}#toast.err{border-color:var(--re)}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.tags{max-width:40%}}
</style>
</head>
<body>

<div class="stats">
  <div class="st"><b id="s-n">—</b><span>Membres</span></div>
  <div class="st"><b id="s-xp">—</b><span>XP total</span></div>
  <div class="st"><b id="s-enc" style="color:var(--or)">—</b><span>À verser</span></div>
  <div class="st"><b id="s-ver" style="color:var(--gr)">—</b><span>Déjà versé</span></div>
</div>

<div class="bar">
  <input class="in" id="q" type="search" placeholder="Pseudo, nom, email, téléphone…" autocomplete="off">
  <select class="in" id="sort" aria-label="Trier">
    <option value="xp">XP ↓</option>
    <option value="recent">Inscrits récents</option>
    <option value="actif">Dernière connexion</option>
    <option value="az">A → Z</option>
  </select>
</div>
<div class="chips" id="chips"></div>
<div id="list"><div class="empty">Chargement…</div></div>

<div id="dlg" role="dialog" aria-modal="true"><div class="dl">
  <h3 id="dlg-t"></h3><div class="tx" id="dlg-x"></div>
  <textarea class="in" id="dlg-n" maxlength="280" placeholder="Message pour le membre (optionnel)"></textarea>
  <div class="row"><button class="btn b-ghost" id="dlg-no" type="button">Annuler</button><button class="btn b-ok" id="dlg-ok" type="button">Valider</button></div>
</div></div>
<div id="toast"></div>

<script>
// Cette page s'affiche dans le Cerveau (onglet Membres). Ouverte seule, elle y renvoie.
if(!new URLSearchParams(location.search).get('embed')){location.replace('dha-cerveau.html#membres');}

/* ---------- réglages ---------- */
var ACTIONS=[
  {k:'se',i:'🎤',l:'Séminaire',x:500},
  {k:'so',i:'🎉',l:'Sortie / événement (QG)',x:400},
  {k:'me',i:'📞',l:'Appel mentor',x:300},
  {k:'ex',i:'🎯',l:"Preuve d'exercice",x:200},
  {k:'an',i:'📈',l:'Analyse envoyée',x:100},
  {k:'ag',i:'👥',l:'Appel de groupe',x:75},
  {k:'ga',i:'💰',l:'Gain en trading',x:60},
  {k:'pc',i:'🧠',l:'Vidéo Prise de conscience',x:50},
  {k:'gr',i:'✍️',l:'Message dans le groupe',x:10}
];
// Mêmes rangs que le dashboard
var RANGS=[[60000,'💎 LEGEND'],[30000,'👑 AMBASSADEUR'],[15500,'🚀 PRO HUSTLER'],[5000,'⚡ HUSTLER'],[0,'🎮 NEW HUSTLER']];
// Commission de recommandation (20 % du pack), validée paiement par paiement
var COMM={'180':[36],'500':[33,33,34],'750':[50,50,50]};
var INACTIF_J=7, DAY=86400000;

/* ---------- état ---------- */
var S={m:[],last:{},hist:{},open:{},pan:{},rib:{},f:'tous',q:'',sort:'xp',lastOk:false};

/* ---------- utilitaires ---------- */
function $(id){return document.getElementById(id);}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nz(t){return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/^@+/,'').trim();}
function num(n){return (Number(n)||0).toLocaleString('fr-FR');}
function eur(n){return num(n)+' €';}
function rang(xp){xp=xp||0;for(var i=0;i<RANGS.length;i++)if(xp>=RANGS[i][0])return RANGS[i][1];return RANGS[RANGS.length-1][1];}
function get(id){for(var i=0;i<S.m.length;i++)if(String(S.m[i].id)===String(id))return S.m[i];return null;}
function act(k){for(var i=0;i<ACTIONS.length;i++)if(ACTIONS[i].k===k)return ACTIONS[i];return null;}
function parrain(m){var p=nz(m.parraine_par);for(var i=0;i<S.m.length;i++)if(nz(S.m[i].pseudo)===p)return S.m[i];return null;}
function demo(m){return m.plan==='demo';}
function lastSeen(m){return S.last[nz(m.pseudo)]||0;}
function inactif(m){return S.lastOk&&!demo(m)&&(Date.now()-lastSeen(m))>INACTIF_J*DAY;}
function ilya(t){if(!t)return 'jamais';var d=Math.floor((Date.now()-t)/DAY);return d<=0?"aujourd'hui":d===1?'hier':'il y a '+d+' j';}
function dCourt(t){return t?new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'—';}
function masque(r){r=String(r||'').replace(/\s+/g,'');return r.length>8?r.slice(0,4)+' •••• •••• '+r.slice(-4):'••••';}
function comm(m){
  if(!m.parraine_par||demo(m))return null;
  var parts=COMM[String(m.pack||'')];if(!parts)return {ancien:true};
  var n=Math.min(m.commission_valides||0,parts.length),sum=function(a){return a.reduce(function(x,y){return x+y;},0);};
  return {parts:parts,n:n,total:sum(parts),fait:sum(parts.slice(0,n)),attente:n<parts.length};
}
var toastT;
function toast(msg,type){var t=$('toast');t.textContent=msg;t.className='on '+(type||'');clearTimeout(toastT);toastT=setTimeout(function(){t.className='';},2800);}

/* fenêtre de confirmation (remplace confirm()) */
var dlgCb=null;
function ask(titre,texte,avecNote,cb){
  $('dlg-t').textContent=titre;$('dlg-x').textContent=texte;
  $('dlg-n').style.display=avecNote?'block':'none';$('dlg-n').value='';
  dlgCb=cb;$('dlg').classList.add('on');
}
function closeDlg(){$('dlg').classList.remove('on');dlgCb=null;}
$('dlg-no').onclick=closeDlg;
$('dlg-ok').onclick=function(){var cb=dlgCb,n=$('dlg-n').value.trim();closeDlg();if(cb)cb(n);};
$('dlg').onclick=function(e){if(e.target.id==='dlg')closeDlg();};

/* ---------- chargement ---------- */
function load(){
  return Promise.all([
    DHA.admin('dha_admin_membres'),
    DHA.admin('dha_admin_activite').catch(function(){return null;})
  ]).then(function(r){
    if(!Array.isArray(r[0]))throw new Error('réponse vide');
    S.m=r[0];
    if(Array.isArray(r[1])){S.last={};S.lastOk=true;r[1].forEach(function(x){S.last[nz(x.pseudo)]=new Date(x.derniere).getTime();});}
    draw();
  }).catch(function(e){$('list').innerHTML='<div class="empty">Impossible de charger les membres ('+esc(e.message||e)+').</div>';});
}
// Actualisation auto, seulement si tu n'es pas en train de faire quelque chose
function occupe(){
  if($('dlg').classList.contains('on'))return true;
  for(var k in S.pan)if(Object.keys(S.pan[k]).length)return true;
  var a=document.activeElement;return !!(a&&a.closest&&a.closest('.body'));
}
setInterval(function(){if(!document.hidden&&!occupe())load();},60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!occupe())load();});

/* ---------- affichage ---------- */
var FILTRES=[['tous','Tous'],['payants','Payants'],['demo','Démo'],['valider','🤝 Parrainages à valider'],['inactifs','💤 Inactifs '+INACTIF_J+' j']];
function passe(m,f){
  if(f==='payants')return !demo(m);
  if(f==='demo')return demo(m);
  if(f==='valider'){var c=comm(m);return !!(c&&c.attente);}
  if(f==='inactifs')return inactif(m);
  return true;
}
function draw(){
  var M=S.m;
  $('s-n').textContent=M.length;
  $('s-xp').textContent=num(M.reduce(function(s,m){return s+(m.xp||0);},0));
  $('s-enc').textContent=eur(M.reduce(function(s,m){return s+(Number(m.commissions_encours)||0);},0));
  $('s-ver').textContent=eur(M.reduce(function(s,m){return s+(Number(m.commissions_verses)||0);},0));

  $('chips').innerHTML=FILTRES.filter(function(f){return f[0]!=='inactifs'||S.lastOk;}).map(function(f){
    var n=M.filter(function(m){return passe(m,f[0]);}).length;
    var warn=f[0]==='valider'&&n&&S.f!=='valider';
    return '<button type="button" class="chip'+(S.f===f[0]?' on':'')+(warn?' warn':'')+'" data-f="'+f[0]+'">'+esc(f[1])+' · '+n+'</button>';
  }).join('');

  var q=nz(S.q);
  var L=M.filter(function(m){
    if(!passe(m,S.f))return false;
    return !q||nz([m.pseudo,m.prenom,m.nom,(m.prenom||'')+' '+(m.nom||''),m.email,m.telephone,m.ville,m.parraine_par].join(' | ')).indexOf(q)>-1;
  });
  var t=function(v){return v?new Date(v).getTime():0;};
  L.sort(S.sort==='az'?function(a,b){return nz(a.pseudo||a.prenom).localeCompare(nz(b.pseudo||b.prenom));}
       :S.sort==='recent'?function(a,b){return t(b.created_at)-t(a.created_at);}
       :S.sort==='actif'?function(a,b){return lastSeen(b)-lastSeen(a);}
       :function(a,b){return (b.xp||0)-(a.xp||0);});
  $('list').innerHTML=L.length?L.map(carte).join(''):'<div class="empty">Aucun membre.</div>';
}

function carte(m){
  var id=esc(m.id),c=comm(m),enc=Number(m.commissions_encours)||0,op=!!S.open[m.id];
  var nom=m.pseudo||m.prenom||'Membre';
  var contact=/@demo\.dha$/.test(m.email||'')?'📞 '+(m.telephone||'contact non renseigné'):(m.email||m.telephone||'');
  var tags='';
  if(c&&c.attente)tags+='<span class="tag t-val">🤝 À VALIDER</span>';
  if(demo(m))tags+='<span class="tag t-demo">DÉMO</span>';
  if(enc>0)tags+='<span class="tag t-enc">'+esc(eur(enc))+'</span>';
  if(inactif(m))tags+='<span class="tag t-off">💤</span>';
  tags+='<span class="tag t-xp">'+esc(num(m.xp))+' XP</span>';
  var h='<div class="card'+(op?' op':'')+'" id="c-'+id+'">'
    +'<button type="button" class="head" data-open="'+id+'" aria-expanded="'+op+'">'
    +'<div class="av">'+esc(nom.slice(0,2).toUpperCase())+'</div>'
    +'<div class="who"><b>'+esc(nom)+'</b><small>'+esc(contact)+(m.prenom?' · '+esc(m.prenom+' '+(m.nom||'')):'')+'</small></div>'
    +'<div class="tags">'+tags+'</div></button>';
  if(op)h+='<div class="body">'+corps(m,c)+'</div>';
  return h+'</div>';
}

function corps(m,c){
  var id=esc(m.id),p=S.pan[m.id]||{},h='';
  h+='<div class="meta"><span>Rang <b>'+esc(rang(m.xp))+'</b></span>'
    +(S.lastOk?'<span>Vu <b>'+esc(ilya(lastSeen(m)))+'</b></span>':'')
    +(m.created_at?'<span>Inscrit le <b>'+esc(dCourt(m.created_at))+'</b></span>':'')
    +(m.pack&&!demo(m)?'<span>Pack <b>'+esc(m.pack)+' €</b></span>':'')+'</div>';

  if(demo(m))h+='<div class="box mu" style="margin-top:10px">Compte démo : seul le Module 01 est débloqué. Contact : '+esc(m.telephone||'non renseigné')+'. S\'il paie, il se réinscrit normalement.</div>';

  // XP
  h+='<h4>⚡ Donner de l\'XP</h4><div class="acts">'+ACTIONS.map(function(a){
    var n=p[a.k]||0;
    return '<button type="button" class="act'+(n?' sel':'')+'" data-add="'+id+'" data-k="'+a.k+'"><i>'+a.i+'</i><span>'+esc(a.l)+'</span><em>+'+a.x+'</em>'+(n?'<b class="n">'+n+'</b>':'')+'</button>';
  }).join('')+'</div>';
  var tot=0,lignes='';
  Object.keys(p).forEach(function(k){var a=act(k);if(!a)return;tot+=a.x*p[k];
    lignes+='<div class="pl"><span>'+a.i+' '+esc(a.l)+' × '+p[k]+'</span><span class="row"><b style="color:var(--go)">+'+num(a.x*p[k])+'</b><button type="button" data-rm="'+id+'" data-k="'+k+'" aria-label="Retirer">−</button></span></div>';});
  if(tot)h+='<div class="pan">'+lignes+'<div class="row" style="justify-content:space-between;margin-top:8px"><span class="mu" style="font-size:12px">→ '+num((m.xp||0)+tot)+' XP au total</span><span class="row"><button type="button" class="btn b-ghost" data-clr="'+id+'">Vider</button><button type="button" class="btn b-go" data-val="'+id+'">Valider +'+num(tot)+' XP</button></span></div></div>';

  h+='<h4>✏️ Corriger l\'XP</h4><div class="row"><input class="in" id="cx-'+id+'" type="number" step="1" placeholder="-100 ou 50" style="width:110px"><input class="in" id="cr-'+id+'" type="text" maxlength="120" placeholder="Raison (ex : erreur de saisie)" style="flex:1;min-width:140px"><button type="button" class="btn" data-corr="'+id+'">Appliquer</button></div>';

  // Historique
  var H=S.hist[m.id];
  h+='<h4>📜 Derniers gains</h4><div class="hist">';
  if(H===undefined)h+='<div class="mu">Chargement…</div>';
  else if(H===null)h+='<div class="mu">Historique indisponible.</div>';
  else if(!H.length)h+='<div class="mu">Aucun gain pour l\'instant.</div>';
  else h+=H.slice(0,8).map(function(x){var v=Number(x.xp_gagne)||0;
    return '<div class="hl"><time>'+esc(dCourt(x.created_at))+'</time><span>'+esc(x.raison||x.action_key||'')+'</span><b class="'+(v<0?'neg':'pos')+'">'+(v>0?'+':'')+num(v)+'</b></div>';}).join('');
  h+='</div>';

  // Parrainage
  if(c){
    h+='<h4>🤝 Parrainage</h4><div class="box">';
    if(c.ancien)h+='Invité par <b>@'+esc(m.parraine_par)+'</b> · inscrit avant le nouveau système (commission déjà comptée).';
    else{
      var f3=c.parts.length>1;
      h+='Invité par <b>@'+esc(m.parraine_par)+'</b> · pack '+esc(m.pack)+' € · commission '+c.total+' €'+(f3?' en 3 fois':'')
        +'<div class="mu" style="margin:4px 0 8px">'+(f3?c.n+'/3 mensualités validées':(c.n?'Paiement validé':'Paiement pas encore validé'))+' · '+c.fait+' € crédités sur '+c.total+' €</div>';
      h+=c.attente?'<button type="button" class="btn b-go" data-com="'+id+'">✓ J\'ai reçu '+(f3?'la mensualité '+(c.n+1)+'/3':'le paiement')+' → +'+c.parts[c.n]+' € pour @'+esc(m.parraine_par)+'</button>'
                  :'<span style="color:var(--gr)">✅ Commission entièrement validée</span>';
    }
    h+='</div>';
  }

  // Argent (ce membre comme parrain)
  var enc=Number(m.commissions_encours)||0,ver=Number(m.commissions_verses)||0;
  h+='<h4>💶 Ses commissions</h4><div class="money"><div><b style="color:var(--or)">'+esc(eur(enc))+'</b><span>À lui verser</span></div><div><b style="color:var(--gr)">'+esc(eur(ver))+'</b><span>Déjà versé</span></div></div>'
    +'<div class="row"><input class="in" id="ca-'+id+'" type="number" min="1" placeholder="Montant €" style="width:110px"><button type="button" class="btn" data-enc="'+id+'" data-s="1">+ À verser</button><button type="button" class="btn b-red" data-enc="'+id+'" data-s="-1">− À verser</button><button type="button" class="btn b-ok" data-pay="'+id+'"'+(enc?'':' disabled')+'>✓ Tout versé</button></div>';
  var rib=String(m.rib||'').trim();
  h+='<div class="box" style="margin-top:8px">'+(rib.length>2
    ?'<div class="row" style="justify-content:space-between"><span class="rib">RIB : '+esc(S.rib[m.id]?rib:masque(rib))+'</span><span class="row"><button type="button" class="btn b-ghost" data-rib="'+id+'">'+(S.rib[m.id]?'Masquer':'Afficher')+'</button><button type="button" class="btn b-ghost" data-copy="'+id+'">Copier</button></span></div>'
    :'<span class="mu">Aucun RIB enregistré</span>')+'</div>';

  if(!demo(m))h+='<h4>🔑 Compte</h4><button type="button" class="btn" data-pwd="'+id+'">Nouveau mot de passe</button>';
  return h;
}

function redraw(id){var m=get(id),el=$('c-'+id);if(m&&el){var d=document.createElement('div');d.innerHTML=carte(m);el.replaceWith(d.firstChild);}else draw();}

function chargerHist(m){
  DHA.admin('dha_admin_historique',{p_pseudos:[m.pseudo]}).then(function(r){S.hist[m.id]=Array.isArray(r)?r:[];redraw(m.id);})
    .catch(function(){S.hist[m.id]=null;redraw(m.id);});
}

/* ---------- écritures ---------- */
function patch(id,body){return DHA.admin('dha_admin_update_membre',{p_id:id,p:body}).then(function(r){var m=get(id);if(m&&r)Object.assign(m,r);return r;});}
function addXP(m,montant,raison,cle){
  return DHA.admin('dha_admin_add_xp',{p_id:m.id,p_amount:montant,p_raison:raison,p_action_key:cle}).then(function(nv){
    m.xp=nv;delete S.hist[m.id];chargerHist(m);draw();
  });
}
function validerPanier(m){
  var p=S.pan[m.id]||{},tot=0,txt=[],det=[];
  Object.keys(p).forEach(function(k){var a=act(k);if(!a)return;tot+=a.x*p[k];txt.push(a.i+' '+a.l+' × '+p[k]+' = +'+a.x*p[k]+' XP');for(var i=0;i<p[k];i++)det.push(a.i+' '+a.l+' (+'+a.x+' XP)');});
  if(!tot)return;
  ask('⚡ +'+num(tot)+' XP pour '+(m.pseudo||m.prenom),txt.join('\n')+'\n\n→ '+num((m.xp||0)+tot)+' XP au total',true,function(note){
    note=note.replace(/\s*·\s*/g,' - ');
    addXP(m,tot,det.join(' · ')+(note?' · 📝 '+note:''),'man-'+Object.keys(p).join('-')+'-'+Date.now())
      .then(function(){delete S.pan[m.id];redraw(m.id);toast('+'+num(tot)+' XP appliqués ✓','ok');})
      .catch(function(e){toast('Erreur : '+(e.message||e),'err');});
  });
}
function corriger(m){
  var v=parseInt($('cx-'+m.id).value,10),r=$('cr-'+m.id).value.trim();
  if(!v){toast('Entre un nombre d\'XP (négatif pour retirer)','err');return;}
  var raison='✏️ Correction admin'+(r?' : '+r:'');
  ask((v>0?'Ajouter ':'Retirer ')+num(Math.abs(v))+' XP à '+(m.pseudo||m.prenom)+' ?','XP actuel : '+num(m.xp)+'\n→ '+num((m.xp||0)+v)+' XP',false,function(){
    addXP(m,v,raison,'man-corr-'+Date.now()).then(function(){toast('Correction appliquée ✓','ok');}).catch(function(e){toast('Erreur : '+(e.message||e),'err');});
  });
}
// Validation d'une commission : en une seule opération côté serveur si la fonction existe
function validerCom(f){
  var c=comm(f);if(!c||c.ancien||!c.attente)return;
  var par=parrain(f);if(!par){toast('Parrain @'+f.parraine_par+' introuvable','err');return;}
  var mt=c.parts[c.n],etape=c.parts.length>1?'la mensualité '+(c.n+1)+'/3':'le paiement';
  ask('🤝 Valider '+etape+' ?','Tu as bien reçu '+etape+' de @'+(f.pseudo||'')+' ('+f.pack+' €) ?\n\n→ +'+mt+' € de commission pour @'+par.pseudo,false,function(){
    DHA.admin('dha_admin_valider_commission',{p_id:f.id}).then(function(r){
      if(r&&r.filleul)Object.assign(f,r.filleul);if(r&&r.parrain)Object.assign(par,r.parrain);
      fini();
    }).catch(function(e){
      var absente=e.status===404||/PGRST202|Could not find the function/i.test(e.message||'');
      if(!absente){toast('Erreur : '+(e.message||e),'err');return;}
      // Ancienne méthode (tant que le SQL n'est pas installé)
      patch(f.id,{commission_valides:c.n+1}).then(function(){
        var b={commissions_encours:(Number(par.commissions_encours)||0)+mt,commissions_total:(Number(par.commissions_total)||0)+mt};
        if(c.n===0)b.nb_affilies=(par.nb_affilies||0)+1;
        return patch(par.id,b);
      }).then(fini).catch(function(e2){toast('Erreur : '+(e2.message||e2),'err');load();});
    });
    function fini(){draw();toast('✓ +'+mt+' € pour @'+par.pseudo,'ok');}
  });
}
function majEncours(m,signe){
  var a=parseInt($('ca-'+m.id).value,10);if(!a||a<=0){toast('Entre un montant','err');return;}
  var nv=Math.max(0,(Number(m.commissions_encours)||0)+signe*a);
  patch(m.id,{commissions_encours:nv}).then(function(){draw();toast((signe>0?'+':'−')+a+' € à verser','ok');}).catch(function(e){toast('Erreur : '+(e.message||e),'err');});
}
function toutVerse(m){
  var enc=Number(m.commissions_encours)||0;if(!enc)return;
  ask('💶 Marquer '+eur(enc)+' comme versés ?','À @'+(m.pseudo||m.prenom)+'. Fais le virement avant de valider.',false,function(){
    patch(m.id,{commissions_encours:0,commissions_verses:(Number(m.commissions_verses)||0)+enc}).then(function(){draw();toast('✓ '+eur(enc)+' versés','ok');}).catch(function(e){toast('Erreur : '+(e.message||e),'err');});
  });
}

/* ---------- interactions ---------- */
$('q').oninput=function(){S.q=this.value;draw();};
$('sort').onchange=function(){S.sort=this.value;draw();};
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var d=b.dataset,m;
  if(d.f){S.f=d.f;draw();return;}
  if(d.open){m=get(d.open);S.open[d.open]=!S.open[d.open];if(S.open[d.open]&&m&&S.hist[m.id]===undefined)chargerHist(m);redraw(d.open);return;}
  if(d.add){var p=S.pan[d.add]=S.pan[d.add]||{};p[d.k]=(p[d.k]||0)+1;redraw(d.add);return;}
  if(d.rm){var p2=S.pan[d.rm]||{};if(p2[d.k]>1)p2[d.k]--;else delete p2[d.k];redraw(d.rm);return;}
  if(d.clr){delete S.pan[d.clr];redraw(d.clr);return;}
  if(d.rib){S.rib[d.rib]=!S.rib[d.rib];redraw(d.rib);return;}
  m=get(d.val||d.corr||d.com||d.enc||d.pay||d.copy||d.pwd);if(!m)return;
  if(d.val)validerPanier(m);
  else if(d.corr)corriger(m);
  else if(d.com)validerCom(m);
  else if(d.enc)majEncours(m,Number(d.s));
  else if(d.pay)toutVerse(m);
  else if(d.copy){navigator.clipboard.writeText(String(m.rib||'').trim()).then(function(){toast('RIB copié','ok');},function(){toast('Copie impossible','err');});}
  else if(d.pwd)DHA.resetPasswordUI(m);
});

DHA.adminGate(load);
</script>
</body>
</html>
