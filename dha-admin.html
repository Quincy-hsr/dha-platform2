<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHA — Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050914;--s:#0c1220;--s2:#111827;--bd:rgba(255,255,255,0.07);--bd2:rgba(255,255,255,0.12);--tx:#e8f4ff;--mu:rgba(232,244,255,0.45);--cy:#00d4ff;--go:#ffd700;--gr:#00e676;--re:#ff4455;--or:#ff9800}
body{background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;min-height:100vh}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:24px}
.ll{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;letter-spacing:6px}
.ll span{color:var(--cy)}
.lb{background:var(--s);border:0.5px solid var(--bd2);border-radius:16px;padding:32px;width:340px;text-align:center}
.lt{font-size:13px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}
.li{width:100%;background:var(--s2);border:0.5px solid var(--bd2);border-radius:8px;padding:12px 16px;color:var(--tx);font-family:'Inter',sans-serif;font-size:15px;text-align:center;letter-spacing:4px;outline:none;margin-bottom:12px}
.li:focus{border-color:var(--cy)}
.lbtn{width:100%;padding:12px;background:var(--cy);color:#050914;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;letter-spacing:3px;border:none;border-radius:8px;cursor:pointer}
.lerr{color:var(--re);font-size:12px;margin-top:8px;min-height:16px}
#app{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:0.5px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:10}
.tlogo{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:900;letter-spacing:4px}
.tlogo span{color:var(--cy)}
.tright{display:flex;align-items:center;gap:8px}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--gr);animation:pu 2s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}
.llbl{font-size:12px;color:var(--gr)}
.tbtn{padding:6px 12px;border:0.5px solid var(--bd2);border-radius:8px;background:transparent;color:var(--mu);font-size:12px;cursor:pointer;font-family:'Inter',sans-serif}
.tbtn:hover{background:var(--s);color:var(--tx)}
.tbtn.red{border-color:rgba(255,68,85,0.3);color:var(--re)}
.main{padding:22px 24px;max-width:1100px;margin:0 auto}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.sc{background:var(--s);border:0.5px solid var(--bd);border-radius:12px;padding:14px 16px}
.slbl{font-size:11px;color:var(--mu);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.sval{font-size:20px;font-weight:600}
.cy{color:var(--cy)}.go{color:var(--go)}.gr{color:var(--gr)}.or{color:var(--or)}
.sr{margin-bottom:16px}
.si{width:100%;background:var(--s);border:0.5px solid var(--bd2);border-radius:8px;padding:10px 14px;color:var(--tx);font-family:'Inter',sans-serif;font-size:14px;outline:none}
.si:focus{border-color:var(--cy)}
.si::placeholder{color:var(--mu)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mc{background:var(--s);border:0.5px solid var(--bd);border-radius:12px;overflow:hidden}
.mh{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;user-select:none}
.mh:hover{background:rgba(255,255,255,0.02)}
.av{width:38px;height:38px;border-radius:50%;background:rgba(0,212,255,0.12);border:0.5px solid rgba(0,212,255,0.25);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--cy);flex-shrink:0;pointer-events:none}
.mi{flex:1;min-width:0;pointer-events:none}
.mn{font-size:14px;font-weight:500;color:var(--tx)}
.me{font-size:12px;color:var(--mu);margin-top:2px}
.mbd{display:flex;gap:6px;align-items:center;flex-shrink:0;pointer-events:none}
.bx{font-size:11px;padding:3px 10px;border-radius:99px}
.bxp{background:rgba(255,215,0,0.1);color:var(--go);border:0.5px solid rgba(255,215,0,0.25)}
.br{background:rgba(0,212,255,0.1);color:var(--cy);border:0.5px solid rgba(0,212,255,0.25)}
.bra{background:rgba(255,215,0,0.1);color:var(--go);border:0.5px solid rgba(255,215,0,0.3)}
.ch{font-size:20px;color:var(--mu);pointer-events:none;transition:transform .2s;line-height:1}
.md{padding:0 16px 18px;border-top:0.5px solid var(--bd)}
.stitle{font-size:10px;color:var(--mu);letter-spacing:1.5px;text-transform:uppercase;margin:14px 0 10px}

/* XP ACTIONS */
.xag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.xac{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:10px}
.xac.sel{border-color:rgba(255,215,0,0.6);background:rgba(255,215,0,0.07)}
.xai{font-size:18px;margin-bottom:3px}
.xal{font-size:12px;color:var(--tx);margin-bottom:3px;line-height:1.3}
.xab{font-size:11px;color:var(--mu);margin-bottom:7px}
.xqr{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.xql{font-size:11px;color:var(--mu)}
.xqi{width:54px;padding:4px 6px;background:var(--bg);border:1px solid var(--bd2);border-radius:5px;color:var(--tx);font-size:13px;text-align:center;font-family:'Inter',sans-serif;outline:none}
.xqi:focus{border-color:var(--go)}
.xadd{width:100%;padding:6px;background:rgba(255,215,0,0.13);color:var(--go);border:1px solid rgba(255,215,0,0.35);border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.xadd:hover{background:rgba(255,215,0,0.22)}

/* PANIER */
.pan{background:rgba(255,215,0,0.04);border:1px solid rgba(255,215,0,0.25);border-radius:10px;padding:14px;margin-top:10px}
.pantitle{font-size:11px;color:var(--go);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.panitem{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:0.5px solid rgba(255,255,255,0.05)}
.panitem:last-child{border:none}
.panl{color:var(--mu)}
.panv{color:var(--go);font-weight:600}
.pantot{display:flex;justify-content:space-between;font-size:14px;font-weight:600;padding-top:10px;margin-top:6px;border-top:1px solid rgba(255,215,0,0.2);margin-bottom:6px}
.panaft{font-size:12px;color:var(--mu);margin-bottom:12px}
.panbts{display:flex;gap:8px}
.panval{flex:1;padding:10px;background:rgba(0,230,118,0.13);color:var(--gr);border:1px solid rgba(0,230,118,0.3);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.panval:hover{background:rgba(0,230,118,0.22)}
.panres{padding:10px 14px;background:rgba(255,68,85,0.08);color:var(--re);border:1px solid rgba(255,68,85,0.25);border-radius:8px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif}
.panres:hover{background:rgba(255,68,85,0.16)}

/* CONFIRM */
.conf{position:fixed;inset:0;background:rgba(5,9,20,0.9);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.confbox{background:var(--s);border:1px solid rgba(255,215,0,0.35);border-radius:16px;padding:26px;width:100%;max-width:400px}
.conftitle{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;color:var(--tx);letter-spacing:2px;margin-bottom:16px}
.confinfo{font-size:13px;color:var(--mu);line-height:2;white-space:pre-line;background:var(--s2);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.confarr{font-size:17px;font-weight:700;color:var(--gr);margin-bottom:16px;display:block}
.confbts{display:flex;gap:8px}
.confyes{flex:1;padding:11px;background:rgba(0,230,118,0.15);color:var(--gr);border:1px solid rgba(0,230,118,0.35);border-radius:8px;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;cursor:pointer}
.confyes:hover{background:rgba(0,230,118,0.25)}
.confno{padding:11px 16px;background:transparent;color:var(--mu);border:1px solid var(--bd2);border-radius:8px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif}

/* COMMISSIONS */
.ccg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ccard{background:var(--s2);border:0.5px solid var(--bd);border-radius:10px;padding:13px}
.cclbl{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.ccval{font-size:20px;font-weight:600;margin-bottom:9px}
.enc{color:var(--or)}.ver{color:var(--gr)}
.cr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ci{width:72px;padding:5px 7px;background:var(--bg);border:0.5px solid var(--bd2);border-radius:6px;color:var(--tx);font-size:13px;text-align:center;font-family:'Inter',sans-serif;outline:none}
.ci:focus{border-color:var(--cy)}
.bg{padding:6px 10px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;border:none}
.bgg{background:rgba(0,230,118,0.14);color:var(--gr);border:0.5px solid rgba(0,230,118,0.3)}
.bgg:hover{background:rgba(0,230,118,0.24)}
.bgr{background:rgba(255,68,85,0.1);color:var(--re);border:0.5px solid rgba(255,68,85,0.3)}
.bgr:hover{background:rgba(255,68,85,0.2)}
.bver{width:100%;margin-top:8px;padding:8px;background:rgba(0,230,118,0.09);color:var(--gr);border:0.5px solid rgba(0,230,118,0.25);border-radius:6px;font-family:'Inter',sans-serif;font-size:12px;cursor:pointer}
.bver:hover{background:rgba(0,230,118,0.18)}
.bver:disabled{opacity:.4;cursor:not-allowed}
.ribbox{background:var(--s2);border:0.5px solid var(--bd);border-radius:10px;padding:11px 13px}
.ribv{font-size:13px;font-weight:500;color:var(--cy);letter-spacing:1px}
.ribe{font-size:13px;color:var(--mu);font-style:italic}
.calcbox{background:rgba(0,212,255,0.04);border:0.5px solid rgba(0,212,255,0.15);border-radius:10px;padding:11px}
.calcrow{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:0.5px solid rgba(255,255,255,0.05)}
.calcrow:last-child{border:none}
.cdim{color:var(--mu)}.cpos{color:var(--gr)}
#toast{position:fixed;bottom:22px;right:22px;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9999;max-width:280px}
#toast.ok{opacity:1;background:rgba(0,230,118,0.15);color:var(--gr);border:0.5px solid rgba(0,230,118,0.35)}
#toast.err{opacity:1;background:rgba(255,68,85,0.15);color:var(--re);border:0.5px solid rgba(255,68,85,0.35)}
.loader{text-align:center;padding:36px;color:var(--mu);font-size:14px}
.empty{text-align:center;padding:36px;color:var(--mu);font-size:14px}
@media(max-width:700px){.sgrid{grid-template-columns:repeat(2,1fr)}.xag{grid-template-columns:repeat(2,1fr)}.ccg{grid-template-columns:1fr}.main{padding:14px}.topbar{padding:11px 14px}}
</style>
</head>
<body>

<div id="lock">
  <div class="ll">DH<span>A</span></div>
  <div class="lb">
    <div class="lt">Accès administrateur</div>
    <input class="li" type="password" id="pwd" placeholder="••••••••">
    <button class="lbtn" id="lbtn">ACCÉDER</button>
    <div class="lerr" id="lerr"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="tlogo">DH<span>A</span> — ADMIN</div>
    <div class="tright">
      <div class="ldot"></div><span class="llbl">En ligne</span>
      <button class="tbtn" id="rbtn">↻ Actualiser</button>
      <button class="tbtn red" id="obtn">Déconnexion</button>
    </div>
  </div>
  <div class="main">
    <div class="sgrid">
      <div class="sc"><div class="slbl">Membres</div><div class="sval cy" id="st">—</div></div>
      <div class="sc"><div class="slbl">XP total</div><div class="sval go" id="sx">—</div></div>
      <div class="sc"><div class="slbl">En cours</div><div class="sval or" id="se">—</div></div>
      <div class="sc"><div class="slbl">Versé</div><div class="sval gr" id="sv">—</div></div>
    </div>
    <div class="sr"><input class="si" id="search" placeholder="Rechercher pseudo, prénom, email..."></div>
    <div class="mlist" id="mlist"><div class="loader">Chargement...</div></div>
  </div>
</div>

<!-- CONFIRM -->
<div class="conf" id="conf" style="display:none">
  <div class="confbox">
    <div class="conftitle">⚡ CONFIRMER L'AJOUT XP</div>
    <div class="confinfo" id="cinfo"></div>
    <span class="confarr" id="carr"></span>
    <div class="confbts">
      <button class="confno" id="cno">Annuler</button>
      <button class="confyes" id="cyes">✓ OUI VALIDER</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
var PASS='050876';
var SUPA='https://kdetwppxsfoagyndrlzr.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkZXR3cHB4c2ZvYWd5bmRybHpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzM3NjQsImV4cCI6MjA5MjgwOTc2NH0.OodaFQKEHcncDYdO6uM121NAUbyxD4UxpptSjzzZOi0';
var H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
var members=[];
var paniers={};
var confCb=null;
var toastT;

var ACTIONS=[
  {k:'co',i:'🔌',l:'Connexion quotidienne',x:10},
  {k:'mo',i:'📚',l:'Finir un module',x:50},
  {k:'di',i:'💬',l:'Messages Discord',x:10},
  {k:'li',i:'📺',l:'Participer à un live',x:100},
  {k:'me',i:'📞',l:'Appel mentor',x:75},
  {k:'fi',i:'🗓️',l:'Fidélité mensuelle',x:100},
  {k:'pa',i:'🤝',l:'Parrainer un ami',x:250},
  {k:'tp',i:'💰',l:'Take Profit validé',x:200},
  {k:'qg',i:'🏢',l:'Venir au QG',x:250},
  {k:'ev',i:'🎉',l:'Venir à un événement',x:300}
];

var RANGS={'membre simple':{n1:0,n2:0},'affilié':{n1:20,n2:0},'ambassadeur':{n1:25,n2:5}};

function getRang(m){
  var s=(m.statut_affiliation||'').toLowerCase();
  if(s.indexOf('ambass')>-1)return 'ambassadeur';
  if(s.indexOf('affil')>-1)return 'affilié';
  return 'membre simple';
}
function getAction(k){for(var i=0;i<ACTIONS.length;i++)if(ACTIONS[i].k===k)return ACTIONS[i];return null;}
function getMember(id){for(var i=0;i<members.length;i++)if(members[i].id===id)return members[i];return null;}
function ini(m){return((m.pseudo||m.prenom||'?').substring(0,2)).toUpperCase();}

// AUTH
document.getElementById('lbtn').onclick=unlock;
document.getElementById('pwd').onkeydown=function(e){if(e.key==='Enter')unlock();};
document.getElementById('rbtn').onclick=load;
document.getElementById('obtn').onclick=function(){sessionStorage.removeItem('dha_admin');location.reload();};
document.getElementById('search').oninput=filter;
document.getElementById('cno').onclick=function(){document.getElementById('conf').style.display='none';confCb=null;};
document.getElementById('cyes').onclick=function(){if(confCb){confCb();document.getElementById('conf').style.display='none';confCb=null;}};

function unlock(){
  if(document.getElementById('pwd').value===PASS){
    document.getElementById('lock').style.display='none';
    document.getElementById('app').style.display='block';
    sessionStorage.setItem('dha_admin','1');
    load();
  } else {
    document.getElementById('lerr').textContent='Mot de passe incorrect.';
    document.getElementById('pwd').value='';
  }
}
if(sessionStorage.getItem('dha_admin')==='1'){
  document.getElementById('lock').style.display='none';
  document.getElementById('app').style.display='block';
  load();
}

function load(){
  document.getElementById('mlist').innerHTML='<div class="loader">Chargement...</div>';
  fetch(SUPA+'/rest/v1/membres?select=*&order=xp.desc',{headers:H})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!Array.isArray(d))throw 0;
      members=d;
      stats(d);
      render(d);
    })
    .catch(function(){document.getElementById('mlist').innerHTML='<div class="empty">Erreur Supabase.</div>';});
}

function stats(d){
  document.getElementById('st').textContent=d.length;
  document.getElementById('sx').textContent=d.reduce(function(s,m){return s+(m.xp||0);},0).toLocaleString()+' XP';
  document.getElementById('se').textContent=d.reduce(function(s,m){return s+(m.commissions_encours||0);},0)+'€';
  document.getElementById('sv').textContent=d.reduce(function(s,m){return s+(m.commissions_verses||0);},0)+'€';
}

function filter(){
  var q=document.getElementById('search').value.toLowerCase();
  render(members.filter(function(m){
    return (m.pseudo||'').toLowerCase().indexOf(q)>-1||(m.email||'').toLowerCase().indexOf(q)>-1||(m.prenom||'').toLowerCase().indexOf(q)>-1;
  }));
}

function rangBadge(m){
  var r=getRang(m);
  if(r==='ambassadeur')return '<span class="bx bra">👑 Ambassadeur</span>';
  if(r==='affilié')return '<span class="bx br">⚡ Affilié</span>';
  return '<span class="bx br" style="opacity:.5">Membre Simple</span>';
}

function render(data){
  var el=document.getElementById('mlist');
  if(!data.length){el.innerHTML='<div class="empty">Aucun membre.</div>';return;}
  var h='';
  for(var i=0;i<data.length;i++){
    var m=data[i];var id=m.id;
    var enc=m.commissions_encours||0;var ver=m.commissions_verses||0;
    var rang=getRang(m);var t=RANGS[rang];
    var ribH=m.rib&&m.rib.length>2?'<div class="ribv">'+m.rib+'</div>':'<div class="ribe">Aucun RIB enregistré</div>';
    var barH='';
    if(rang==='membre simple'){barH='<div style="font-size:13px;color:var(--mu)">Pas de commission</div>';}
    else{
      barH+='<div class="calcrow"><span class="cdim">Taux N1</span><span class="cpos">'+t.n1+'%</span></div>';
      if(t.n2)barH+='<div class="calcrow"><span class="cdim">Taux N2</span><span class="cpos">'+t.n2+'%</span></div>';
      barH+='<div class="calcrow"><span class="cdim">Medium 180€</span><span class="cpos">'+Math.round(180*t.n1/100)+'€</span></div>';
      barH+='<div class="calcrow"><span class="cdim">Premium 500€</span><span class="cpos">'+Math.round(500*t.n1/100)+'€</span></div>';
    }

    // Actions XP
    var ah='';
    for(var j=0;j<ACTIONS.length;j++){
      var a=ACTIONS[j];
      ah+='<div class="xac" id="xac-'+id+'-'+a.k+'">';
      ah+='<div class="xai">'+a.i+'</div>';
      ah+='<div class="xal">'+a.l+'</div>';
      ah+='<div class="xab">'+a.x+' XP / unité</div>';
      ah+='<div class="xqr"><span class="xql">Qté</span>';
      ah+='<input class="xqi" id="qi-'+id+'-'+a.k+'" type="number" value="1" min="1"></div>';
      ah+='<button class="xadd" data-mid="'+id+'" data-ak="'+a.k+'">+ Ajouter</button>';
      ah+='</div>';
    }

    h+='<div class="mc" id="mc-'+id+'">';
    h+='<div class="mh" data-toggle="'+id+'">';
    h+='<div class="av">'+ini(m)+'</div>';
    h+='<div class="mi"><div class="mn">'+(m.pseudo||m.prenom||'Membre')+'</div>';
    h+='<div class="me">'+(m.email||'')+(m.prenom?' · '+m.prenom+' '+(m.nom||''):'')+'</div></div>';
    h+='<div class="mbd">'+rangBadge(m)+'<span class="bx bxp" id="bxp-'+id+'">'+(m.xp||0).toLocaleString()+' XP</span>';
    if(enc>0)h+='<span class="bx" style="background:rgba(255,152,0,0.1);color:var(--or);border:0.5px solid rgba(255,152,0,0.3)">'+enc+'€</span>';
    h+='</div><span class="ch" id="ch-'+id+'">▾</span></div>';

    h+='<div class="md" id="md-'+id+'" style="display:none">';
    // XP section
    h+='<div class="stitle">Actions XP</div>';
    h+='<div class="xag">'+ah+'</div>';
    // Panier
    h+='<div id="pan-'+id+'" style="display:none" class="pan">';
    h+='<div class="pantitle">🛒 À valider</div>';
    h+='<div id="panitems-'+id+'"></div>';
    h+='<div class="pantot"><span>Total</span><span id="pantot-'+id+'" style="color:var(--go)">+0 XP</span></div>';
    h+='<div class="panaft" id="panaft-'+id+'"></div>';
    h+='<div class="panbts">';
    h+='<button class="panres" data-res="'+id+'">✕ Vider</button>';
    h+='<button class="panval" data-val="'+id+'">✓ Valider et appliquer</button>';
    h+='</div></div>';
    // RIB
    h+='<div class="stitle">RIB / IBAN</div><div class="ribbox">'+ribH+'</div>';
    // Commissions
    h+='<div class="stitle">Commissions</div>';
    h+='<div class="ccg">';
    h+='<div class="ccard"><div class="cclbl">En cours — à verser</div>';
    h+='<div class="ccval enc" id="cce-'+id+'">'+enc+'€</div>';
    h+='<div class="cr"><input class="ci" id="cie-'+id+'" type="number" min="1" placeholder="25">';
    h+='<button class="bg bgg" data-ca="'+id+'" data-cf="commissions_encours" data-cs="1">+</button>';
    h+='<button class="bg bgr" data-ca="'+id+'" data-cf="commissions_encours" data-cs="-1">−</button></div>';
    h+='<button class="bver" id="bver-'+id+'" data-ver="'+id+'"'+(enc===0?' disabled':'')+'>✓ Tout marquer versé ('+enc+'€)</button>';
    h+='</div>';
    h+='<div class="ccard"><div class="cclbl">Total versé</div>';
    h+='<div class="ccval ver" id="ccv-'+id+'">'+ver+'€</div>';
    h+='<div class="cr"><input class="ci" id="civ-'+id+'" type="number" min="1" placeholder="25">';
    h+='<button class="bg bgg" data-ca="'+id+'" data-cf="commissions_verses" data-cs="1">+</button>';
    h+='<button class="bg bgr" data-ca="'+id+'" data-cf="commissions_verses" data-cs="-1">−</button></div>';
    h+='</div></div>';
    // Barème
    h+='<div class="stitle">Barème — '+rang.toUpperCase()+'</div>';
    h+='<div class="calcbox">'+barH+'</div>';
    h+='</div></div>';
  }
  el.innerHTML=h;
}

// DÉLÉGATION UNIQUE
document.addEventListener('click',function(e){
  var t=e.target;

  // Toggle membre
  var th=t.closest('[data-toggle]');
  if(th&&!t.closest('button')&&!t.closest('input')){
    var mid=th.getAttribute('data-toggle');
    var md=document.getElementById('md-'+mid);
    var ch=document.getElementById('ch-'+mid);
    if(md){var op=md.style.display==='block';md.style.display=op?'none':'block';if(ch)ch.style.transform=op?'':'rotate(180deg)';}
    return;
  }

  // + Ajouter au panier
  if(t.classList.contains('xadd')||t.closest('.xadd')){
    var btn=t.classList.contains('xadd')?t:t.closest('.xadd');
    var mid=parseInt(btn.getAttribute('data-mid'));
    var ak=btn.getAttribute('data-ak');
    var inp=document.getElementById('qi-'+mid+'-'+ak);
    var qty=parseInt(inp?inp.value:1)||1;if(qty<1)qty=1;
    var ac=getAction(ak);if(!ac)return;
    if(!paniers[mid])paniers[mid]={};
    paniers[mid][ak]=(paniers[mid][ak]||0)+qty;
    if(inp)inp.value=1;
    var card=document.getElementById('xac-'+mid+'-'+ak);
    if(card)card.className='xac sel';
    majPanier(mid);
    return;
  }

  // Vider panier
  var resBtn=t.closest('[data-res]');
  if(resBtn){var mid=parseInt(resBtn.getAttribute('data-res'));resetPan(mid);return;}

  // Valider panier
  var valBtn=t.closest('[data-val]');
  if(valBtn){var mid=parseInt(valBtn.getAttribute('data-val'));confirmer(mid);return;}

  // Commissions +/-
  var caBtn=t.closest('[data-ca]');
  if(caBtn&&caBtn.hasAttribute('data-cf')){
    var id=parseInt(caBtn.getAttribute('data-ca'));
    var field=caBtn.getAttribute('data-cf');
    var sign=parseInt(caBtn.getAttribute('data-cs'));
    var isE=(field==='commissions_encours');
    var inp=document.getElementById(isE?'cie-'+id:'civ-'+id);
    var amt=parseInt(inp?inp.value:0);
    if(!amt||amt<=0){toast('Entre un montant','err');return;}
    var m=getMember(id);if(!m)return;
    var nv=Math.max(0,(m[field]||0)+sign*amt);
    var body={};body[field]=nv;
    patch(id,body,function(){
      m[field]=nv;
      document.getElementById(isE?'cce-'+id:'ccv-'+id).textContent=nv+'€';
      if(isE){var bv=document.getElementById('bver-'+id);if(bv){bv.textContent='✓ Tout marquer versé ('+nv+'€)';bv.disabled=(nv===0);}}
      stats(members);if(inp)inp.value='';
      toast((sign>0?'+':'−')+amt+'€ '+(isE?'en cours':'versé'),'ok');
    });
    return;
  }

  // Tout verser
  var verBtn=t.closest('[data-ver]');
  if(verBtn){
    var id=parseInt(verBtn.getAttribute('data-ver'));
    var m=getMember(id);if(!m)return;
    var enc=m.commissions_encours||0;
    if(enc===0){toast('Aucune commission','err');return;}
    var nv=(m.commissions_verses||0)+enc;
    patch(id,{commissions_encours:0,commissions_verses:nv},function(){
      m.commissions_verses=nv;m.commissions_encours=0;
      document.getElementById('cce-'+id).textContent='0€';
      document.getElementById('ccv-'+id).textContent=nv+'€';
      var bv=document.getElementById('bver-'+id);if(bv){bv.textContent='✓ Tout marquer versé (0€)';bv.disabled=true;}
      stats(members);toast('✓ '+enc+'€ versés','ok');
    });
    return;
  }
});

// Stop propagation sur inputs
document.addEventListener('click',function(e){if(e.target.tagName==='INPUT')e.stopPropagation();},true);

function majPanier(id){
  var p=paniers[id]||{};
  var total=0;var items='';var has=false;
  for(var k in p){
    if(p[k]>0){
      has=true;
      var a=getAction(k);if(!a)continue;
      var mt=a.x*p[k];total+=mt;
      items+='<div class="panitem"><span class="panl">'+a.i+' '+a.l+' × '+p[k]+'</span><span class="panv">+'+mt+' XP</span></div>';
    }
  }
  var pan=document.getElementById('pan-'+id);
  if(!pan)return;
  if(!has){pan.style.display='none';return;}
  pan.style.display='block';
  document.getElementById('panitems-'+id).innerHTML=items;
  document.getElementById('pantot-'+id).textContent='+'+total+' XP';
  var m=getMember(id);var xa=m?m.xp||0:0;
  document.getElementById('panaft-'+id).textContent='→ '+(xa+total).toLocaleString()+' XP au total';
}

function resetPan(id){
  paniers[id]={};
  for(var j=0;j<ACTIONS.length;j++){
    var c=document.getElementById('xac-'+id+'-'+ACTIONS[j].k);
    if(c)c.className='xac';
  }
  var pan=document.getElementById('pan-'+id);
  if(pan)pan.style.display='none';
}

function confirmer(id){
  var p=paniers[id]||{};
  var total=0;var lines='';
  for(var k in p){
    if(p[k]>0){
      var a=getAction(k);if(!a)continue;
      var mt=a.x*p[k];total+=mt;
      lines+=a.i+' '+a.l+' × '+p[k]+' = +'+mt+' XP\n';
    }
  }
  if(total===0){toast('Aucune action sélectionnée','err');return;}
  var m=getMember(id);var xa=m?m.xp||0:0;
  document.getElementById('cinfo').textContent='Membre : '+(m.pseudo||m.prenom||'?')+'\nXP actuel : '+xa+' XP\n\n'+lines.trim();
  document.getElementById('carr').textContent='→ '+(xa+total).toLocaleString()+' XP au total (+'+total+' XP)';
  document.getElementById('conf').style.display='flex';
  confCb=function(){
    var nv=xa+total;
    patch(id,{xp:nv},function(){
      var m2=getMember(id);if(m2)m2.xp=nv;
      document.getElementById('bxp-'+id).textContent=nv.toLocaleString()+' XP';
      stats(members);resetPan(id);
      toast('+'+total+' XP appliqués ✓','ok');
    });
  };
}

function patch(id,body,cb){
  fetch(SUPA+'/rest/v1/membres?id=eq.'+id,{method:'PATCH',headers:H,body:JSON.stringify(body)})
    .then(function(r){if(!r.ok)throw r.status;cb();})
    .catch(function(e){toast('Erreur Supabase: '+e,'err');});
}

function toast(msg,type){
  clearTimeout(toastT);
  var el=document.getElementById('toast');
  el.textContent=msg;el.className=type;
  toastT=setTimeout(function(){el.className='';},3000);
}

setInterval(load,60000);
</script>
